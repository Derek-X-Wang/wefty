minimumLimaVersion: 2.2.0

base:
- template:_images/ubuntu-lts
- template:_default/mounts

vmType: vz
cpus: 6
memory: 8GiB
disk: 60GiB
mountType: virtiofs

containerd:
  system: true
  user: false

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    install -d -m 0700 /var/lib/wefty-agent-computer/profiles
    install -d -m 0755 /var/lib/wefty-agent-computer/evidence
    timeout 120 bash -c 'until test -S /run/containerd/containerd.sock; do sleep 1; done'

probes:
- script: |
    #!/bin/bash
    set -eux -o pipefail
    test -S /run/containerd/containerd.sock
    test -d /var/lib/wefty-agent-computer/profiles

portForwards:
- guestPort: 6080
  hostPort: 16080
  hostIP: 127.0.0.1
- guestPort: 6081
  hostPort: 16081
  hostIP: 127.0.0.1
- guestPort: 6082
  hostPort: 16082
  hostIP: 127.0.0.1
- guestPort: 6083
  hostPort: 16083
  hostIP: 127.0.0.1
- guestPort: 6084
  hostPort: 16084
  hostIP: 127.0.0.1
- guestPort: 6085
  hostPort: 16085
  hostIP: 127.0.0.1
- guestPort: 6086
  hostPort: 16086
  hostIP: 127.0.0.1
- guestPort: 6087
  hostPort: 16087
  hostIP: 127.0.0.1

message: |
  Shared-VM topology for ticket #118.
  Browser endpoints are guest ports 6080-6087, forwarded only to host loopback.
  Run fabric_gate.py on the Mac to bind authenticated endpoints to the tailnet IP.
