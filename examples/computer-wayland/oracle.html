<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wefty Wayland Computer</title>
    <style>
      :root { color-scheme: dark; font-family: "DejaVu Sans", sans-serif; }
      body { align-items: center; background: #111827; display: flex; height: 100vh; justify-content: center; margin: 0; }
      main { background: #1f2937; border: 4px solid #38bdf8; border-radius: 1rem; padding: 3rem; text-align: center; width: 44rem; }
      body[data-theme="amber"] { background: #1c1917; }
      body[data-theme="amber"] main { background: #292524; border-color: #f59e0b; }
      #state { font: 3rem monospace; text-transform: uppercase; }
    </style>
  </head>
  <body tabindex="0" data-wefty-input-oracle="v1" data-theme="graphite">
    <main>
      <h1>Wefty GPU-free Wayland Computer</h1>
      <p>Keyboard-first agent workspace</p>
      <output id="state">idle</output>
    </main>
    <script>
      const refresh = async () => {
        try {
          const state = await (await fetch('/agent-state', {cache: 'no-store'})).json();
          const theme = await (await fetch('/theme', {cache: 'no-store'})).json();
          document.querySelector('#state').value = state.state;
          document.body.dataset.theme = theme.theme;
        } catch (_) {}
      };
      const recordPointer = event => fetch('/input', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          version: 1,
          kind: 'pointer',
          x: event.clientX,
          y: event.clientY + (window.outerHeight - window.innerHeight),
        }),
      }).catch(() => {});
      for (const type of ['pointermove', 'pointerdown', 'pointerup']) {
        window.addEventListener(type, recordPointer);
      }
      setInterval(refresh, 100);
      refresh();
      document.body.focus();
      fetch('/surface-ready', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({version: 1}),
      });
    </script>
  </body>
</html>
