name: tsnet-headscale

# The tsnet Fabric identity tests (machine and person WhoIs, node agent
# registration, service reachability) on every PR, against a Headscale and a
# DERP relay that the lane script starts on the runner (#1488). Secretless by
# construction: no Tailscale account, no repository secret; the pre-auth keys
# live only inside this job. tsnet-smoke.yml stays the drift check against
# real Tailscale.
#
# Pins live in scripts/tsnet-headscale-lane.sh: Headscale v0.29.5 by SHA-256,
# and derper built from the tailscale.com version in go.mod. Headscale
# supports only a window of Tailscale client versions, so a tailscale.com
# bump may need a Headscale bump.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tsnet-headscale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsnet-headscale:
    name: tsnet-headscale
    runs-on: ubuntu-latest
    # Build of derper and the two test packages, two go test runs bounded by
    # -timeout=8m per package and 5m, and the readiness waits, with margin.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The Headscale binary survives a short GitHub release-download outage
      # (#1567). The lane checks the pinned SHA-256 on every run, cached or not.
      - name: Read the Headscale pin for the cache key
        id: headscale-pin
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          version="$(sed -n 's/^readonly HEADSCALE_VERSION=//p' scripts/tsnet-headscale-lane.sh)"
          sha256="$(sed -n 's/^readonly HEADSCALE_SHA256_LINUX_AMD64=//p' scripts/tsnet-headscale-lane.sh)"
          test -n "$version" && test -n "$sha256"
          printf 'key=headscale-release-v1-%s-linux-amd64-%s\n' "$version" "$sha256" >> "$GITHUB_OUTPUT"
      - name: Restore the verified Headscale binary
        id: headscale-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/headscale-release
          key: ${{ steps.headscale-pin.outputs.key }}
      - name: Run the tsnet identity tests against a local Headscale
        env:
          HEADSCALE_CACHE_DIR: ${{ runner.temp }}/headscale-release
        run: bash scripts/tsnet-headscale-lane.sh
      # The lane stores only a binary that passed the check, so a failed test
      # run still keeps the download for the next one.
      - name: Find a verified Headscale binary to save
        id: headscale-verified
        if: always() && steps.headscale-cache.outputs.cache-hit != 'true'
        run: |
          if [ -n "$(ls -A "$RUNNER_TEMP/headscale-release" 2>/dev/null)" ]; then
            echo present=true >> "$GITHUB_OUTPUT"
          fi
      - name: Save the verified Headscale binary
        if: always() && steps.headscale-verified.outputs.present == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/headscale-release
          key: ${{ steps.headscale-pin.outputs.key }}
