name: contract-gate

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: contract-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Enforce Fabric import boundary
        run: bash scripts/check-fabric-boundary.sh
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  sqlite-integration:
    name: sqlite-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run SQLite integration suite
        run: |
          echo "M0 placeholder: SQLite queue and ledger code arrives in M1/M2."
          go test -tags=sqlite_integration ./...

  mac-linux-runner:
    name: mac-linux-runner / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run cross-platform runner and contract tests
        run: go test ./...

  dogfood-workflow:
    name: dogfood-workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workflows/dogfood/package-lock.json
      - name: Install dogfood dependencies
        working-directory: workflows/dogfood
        run: npm ci
      - name: Lint dogfood workflow
        working-directory: workflows/dogfood
        run: npm run lint
      - name: Typecheck dogfood workflow
        working-directory: workflows/dogfood
        run: npm run typecheck
      - name: Build and run dogfood contract smoke
        working-directory: workflows/dogfood
        run: npm test

  tsnet-smoke:
    name: tsnet-smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Require credential for trusted-repository tsnet lane
        # Arm the lane by setting repository variable TSNET_SMOKE_REQUIRED=true
        # once the TS_AUTHKEY secret is provisioned. Armed + missing secret
        # fails loudly; unarmed the lane is a visible no-op, never a fake pass
        # of credentialed tests.
        if: vars.TSNET_SMOKE_REQUIRED == 'true'
        run: test -n "$TS_AUTHKEY" || { echo "TS_AUTHKEY is required for the trusted-repository tsnet lane" >&2; exit 1; }
      - name: Run credentialed tsnet smoke
        if: vars.TSNET_SMOKE_REQUIRED == 'true'
        run: go test -tags=tsnet_smoke ./... -run '^TestTSNetSmoke$'
      - name: Lane unarmed notice
        if: vars.TSNET_SMOKE_REQUIRED != 'true'
        run: echo "tsnet smoke lane is unarmed (set TSNET_SMOKE_REQUIRED=true after provisioning TS_AUTHKEY); no credentialed tests ran."
