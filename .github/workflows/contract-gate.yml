name: contract-gate

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: contract-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Enforce Fabric import boundary
        run: bash scripts/check-fabric-boundary.sh
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  sqlite-integration:
    name: sqlite-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run SQLite integration suite
        run: |
          echo "M0 placeholder: SQLite queue and ledger code arrives in M1/M2."
          go test -tags=sqlite_integration ./...

  mac-linux-runner:
    name: mac-linux-runner / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run cross-platform contract tests
        run: go test ./...

  tsnet-smoke:
    name: tsnet-smoke
    runs-on: ubuntu-latest
    env:
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run credentialed tsnet smoke placeholder
        run: |
          if [[ -z "${TS_AUTHKEY}" ]]; then
            echo "M0 placeholder: TS_AUTHKEY is unavailable; tsnet implementation arrives in M1."
          else
            echo "M0 placeholder: TS_AUTHKEY is wired; tsnet implementation arrives in M1."
          fi
          go test -tags=tsnet_smoke ./... -run '^TestTSNetSmoke$'
