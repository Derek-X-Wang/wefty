name: contract-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contract-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance-image:
    name: acceptance-image
    uses: ./.github/workflows/acceptance-image-build.yml
    permissions:
      contents: read

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check OpenAPI JSON formatting
        run: go test ./api/openapi -run '^TestOpenAPIFilesUseSpaceIndentation$'
      - name: Enforce Fabric import boundary
        run: bash scripts/check-fabric-boundary.sh
      - name: Vet
        run: go vet ./...
      - name: Vet production-timing acceptance build
        run: GOOS=linux go vet -tags=service_acceptance_realtiming ./...
      - name: Vet Darwin production-timing acceptance build
        run: GOOS=darwin go vet -tags=service_acceptance_realtiming ./...
      - name: Test
        # Go's default 10 min per package is too tight: cmd/wefty takes 7-9 min
        # on a green hosted runner and l1 up to 7.5 min (#1208).
        run: go test -timeout=30m ./...
      - name: Validate acceptance image workflow and artifact contract
        run: |
          go tool actionlint
          bash scripts/test-acceptance-image.sh
      - name: Exercise privileged OCI install and configure path
        run: bash scripts/test-install-oci-privileged.sh

  debian-systemd-252:
    name: debian-systemd-252
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: Install lane prerequisites
        run: apt-get update && apt-get install --yes ca-certificates git systemd
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify the Debian 12 helper unit with systemd 252
        env:
          WEFTY_REQUIRE_SYSTEMD_252: "1"
        run: go test ./runner/linuxunit -run '^TestSystemd252LaneValidatesLegacyHelperPolicy$' -count=1

  sqlite-integration:
    name: sqlite-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run SQLite integration suite
        run: |
          echo "M0 placeholder: SQLite queue and ledger code arrives in M1/M2."
          # cmd/wefty takes 435-590 s here and hit the 10-minute default
          # (#1034); a hang still fails here.
          go test -timeout=20m -tags=sqlite_integration ./...

  mac-linux-runner:
    name: mac-linux-runner / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run cross-platform runner and contract tests
        if: matrix.os != 'macos-latest'
        run: go test -timeout=45m ./...
      - name: Run cross-platform runner and contract tests (per-test times)
        if: matrix.os == 'macos-latest'
        # cmd/wefty takes 1107-1552 s on hosted macOS runners and hit 30m
        # (#163, #1034, #1326; growth tracked in #1035); a hang still fails here.
        # -json records every test's elapsed time for #1035. The log shows the
        # package lines as before, then the output of every test that failed
        # or did not finish (a timeout panic ends a test without a fail event).
        run: |
          report="$RUNNER_TEMP/go-test.json"
          set +e
          go test -json -timeout=45m ./... | tee "$report" | jq --unbuffered -rj 'select((.Action == "output" and .Test == null) or .Action == "build-output") | .Output'
          status=("${PIPESTATUS[@]}")
          set -e
          if [ "${status[0]}" -ne 0 ]; then
            echo "--- output of tests that failed or did not finish ---"
            jq -c 'select(.Test != null and (.Action == "run" or .Action == "pass" or .Action == "skip")) | [.Action, .Package, .Test]' "$report" |
              jq -sc 'map(select(.[0] == "run") | .[1:]) - map(select(.[0] != "run") | .[1:])' > "$RUNNER_TEMP/unfinished.json"
            jq -c 'select(.Action == "fail" and .Test == null) | .Package' "$report" | jq -sc . > "$RUNNER_TEMP/failed-packages.json"
            # A failed package with no such test (a crash blamed on a finished test)
            # replays all of its test output.
            jq -rj --slurpfile unfinished "$RUNNER_TEMP/unfinished.json" --slurpfile failed "$RUNNER_TEMP/failed-packages.json" '
              $unfinished[0] as $u | ($failed[0] - ($u | map(.[0]))) as $whole
              | select(.Action == "output" and .Test != null and (([.Package, .Test] | IN($u[])) or (.Package | IN($whole[]))))
              | .Output' "$report"
          fi
          [ "${status[1]}" -eq 0 ] && [ "${status[2]}" -eq 0 ] || exit 1
          exit "${status[0]}"
      - name: Upload per-test times
        if: always() && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: go-test-json-macos-latest
          path: ${{ runner.temp }}/go-test.json
          retention-days: 14
          if-no-files-found: warn

  service-acceptance:
    name: service-acceptance / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run service acceptance suite
        # -p 1 serializes package test binaries. This lane spawns real agent,
        # control-plane, guardian and payload processes, and running those
        # packages concurrently starves them on the slowest runner in the
        # matrix — observed as TestTimeoutTerminatesThenKillsEntireProcessGroup
        # timing out on macos-latest while passing in every other job.
        # -timeout=45m matches mac-linux-runner: cmd/wefty takes 1107-1243 s
        # here on hosted macOS and hit 30m on PR #1319 (#163, #1035, #1326).
        run: go test -p 1 -timeout=45m -tags=service_acceptance ./...

  dogfood-workflow:
    name: dogfood-workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workflows/dogfood/package-lock.json
      - name: Install dogfood dependencies
        working-directory: workflows/dogfood
        run: npm ci
      - name: Lint dogfood workflow
        working-directory: workflows/dogfood
        run: npm run lint
      - name: Typecheck dogfood workflow
        working-directory: workflows/dogfood
        run: npm run typecheck
      - name: Build and run dogfood contract smoke
        working-directory: workflows/dogfood
        run: npm test
      # `wefty workflow init NAME --lang ts` end to end on the Node the scaffold
      # README states: the inline mailbox writer against `wefty run` byte for
      # byte, then a scaffold built with npm ci/npm test and its bundle
      # submitted to a real stack. WEFTY_REQUIRE_NODE turns the writer tests'
      # missing-Node skip into a failure, so this lane cannot go green without
      # running them.
      - name: Exercise the TypeScript workflow scaffold
        env:
          WEFTY_TS_SCAFFOLD_EXERCISE: "1"
          WEFTY_REQUIRE_NODE: "1"
        run: go test ./agent/ ./cmd/wefty/ -run 'TypeScript' -count=1

  branch-gates-workflow:
    name: branch-gates-workflow
    runs-on: ubuntu-latest
    # Margin over the test binary's own 10-minute default timeout, which is
    # itself the outer bound on the 5-minute per-run budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      # Stands up L1, L3, an agent and the process runner, then submits
      # workflows/branch-gates/branch-gates.sh against a purpose-built subject
      # repository with a clean branch and a deliberately broken one. The
      # kind=oci path is proven on the Lima node, not here; running wefty's own
      # go test ./... inside a container is a node-lane cost.
      # WEFTY_REQUIRE_SHELLCHECK turns the script lint from a skip into a
      # failure, so this lane cannot go green without actually linting.
      - name: Exercise the branch-gates workflow against a real stack
        env:
          WEFTY_BRANCH_GATES_EXERCISE: "1"
          WEFTY_REQUIRE_SHELLCHECK: "1"
        run: go test ./workflows/branch-gates/ -count=1

  # The credentialed tsnet lane lives in tsnet-smoke.yml (push to main +
  # weekly schedule, never pull_request) so every job in this PR-facing
  # workflow is secretless by construction.
  all-tests-pass:
    name: all-tests-pass
    needs:
      - acceptance-image
      - unit
      - debian-systemd-252
      - sqlite-integration
      - mac-linux-runner
      - service-acceptance
      - dogfood-workflow
      - branch-gates-workflow
    # always() so a failed dependency cannot skip this job — a skipped
    # required check does not block merging. The step then fails closed
    # unless every lane result is exactly "success".
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required lane results
        env:
          ACCEPTANCE_IMAGE_RESULT: ${{ needs['acceptance-image'].result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          DEBIAN_SYSTEMD_252_RESULT: ${{ needs['debian-systemd-252'].result }}
          SQLITE_RESULT: ${{ needs['sqlite-integration'].result }}
          MAC_LINUX_RESULT: ${{ needs['mac-linux-runner'].result }}
          SERVICE_ACCEPTANCE_RESULT: ${{ needs['service-acceptance'].result }}
          DOGFOOD_RESULT: ${{ needs['dogfood-workflow'].result }}
          BRANCH_GATES_RESULT: ${{ needs['branch-gates-workflow'].result }}
        run: |
          set -eu
          printf '%s\n' \
            "acceptance-image=$ACCEPTANCE_IMAGE_RESULT" \
            "unit=$UNIT_RESULT" \
            "debian-systemd-252=$DEBIAN_SYSTEMD_252_RESULT" \
            "sqlite-integration=$SQLITE_RESULT" \
            "mac-linux-runner=$MAC_LINUX_RESULT" \
            "service-acceptance=$SERVICE_ACCEPTANCE_RESULT" \
            "dogfood-workflow=$DOGFOOD_RESULT" \
            "branch-gates-workflow=$BRANCH_GATES_RESULT"
          test "$ACCEPTANCE_IMAGE_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$DEBIAN_SYSTEMD_252_RESULT" = success
          test "$SQLITE_RESULT" = success
          test "$MAC_LINUX_RESULT" = success
          test "$SERVICE_ACCEPTANCE_RESULT" = success
          test "$DOGFOOD_RESULT" = success
          test "$BRANCH_GATES_RESULT" = success
