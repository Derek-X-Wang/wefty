name: contract-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contract-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance-image:
    name: acceptance-image
    uses: ./.github/workflows/acceptance-image-build.yml
    permissions:
      contents: read

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Enforce Fabric import boundary
        run: bash scripts/check-fabric-boundary.sh
      - name: Vet
        run: go vet ./...
      - name: Vet production-timing acceptance build
        run: GOOS=linux go vet -tags=service_acceptance_realtiming ./...
      - name: Vet Darwin production-timing acceptance build
        run: GOOS=darwin go vet -tags=service_acceptance_realtiming ./...
      - name: Test
        run: go test ./...
      - name: Validate acceptance image workflow and artifact contract
        run: |
          go tool actionlint
          bash scripts/test-acceptance-image.sh
      - name: Exercise privileged OCI install and configure path
        run: bash scripts/test-install-oci-privileged.sh

  sqlite-integration:
    name: sqlite-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run SQLite integration suite
        run: |
          echo "M0 placeholder: SQLite queue and ledger code arrives in M1/M2."
          go test -tags=sqlite_integration ./...

  mac-linux-runner:
    name: mac-linux-runner / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run cross-platform runner and contract tests
        run: go test ./...

  service-acceptance:
    name: service-acceptance / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run service acceptance suite
        # -p 1 serializes package test binaries. This lane spawns real agent,
        # control-plane, guardian and payload processes, and running those
        # packages concurrently starves them on the slowest runner in the
        # matrix — observed as TestTimeoutTerminatesThenKillsEntireProcessGroup
        # timing out on macos-latest while passing in every other job.
        run: go test -p 1 -tags=service_acceptance ./...

  dogfood-workflow:
    name: dogfood-workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workflows/dogfood/package-lock.json
      - name: Install dogfood dependencies
        working-directory: workflows/dogfood
        run: npm ci
      - name: Lint dogfood workflow
        working-directory: workflows/dogfood
        run: npm run lint
      - name: Typecheck dogfood workflow
        working-directory: workflows/dogfood
        run: npm run typecheck
      - name: Build and run dogfood contract smoke
        working-directory: workflows/dogfood
        run: npm test

  # The credentialed tsnet lane lives in tsnet-smoke.yml (push to main +
  # weekly schedule, never pull_request) so every job in this PR-facing
  # workflow is secretless by construction.
  all-tests-pass:
    name: all-tests-pass
    needs:
      - acceptance-image
      - unit
      - sqlite-integration
      - mac-linux-runner
      - service-acceptance
      - dogfood-workflow
    # always() so a failed dependency cannot skip this job — a skipped
    # required check does not block merging. The step then fails closed
    # unless every lane result is exactly "success".
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required lane results
        env:
          ACCEPTANCE_IMAGE_RESULT: ${{ needs['acceptance-image'].result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          SQLITE_RESULT: ${{ needs['sqlite-integration'].result }}
          MAC_LINUX_RESULT: ${{ needs['mac-linux-runner'].result }}
          SERVICE_ACCEPTANCE_RESULT: ${{ needs['service-acceptance'].result }}
          DOGFOOD_RESULT: ${{ needs['dogfood-workflow'].result }}
        run: |
          set -eu
          printf '%s\n' \
            "acceptance-image=$ACCEPTANCE_IMAGE_RESULT" \
            "unit=$UNIT_RESULT" \
            "sqlite-integration=$SQLITE_RESULT" \
            "mac-linux-runner=$MAC_LINUX_RESULT" \
            "service-acceptance=$SERVICE_ACCEPTANCE_RESULT" \
            "dogfood-workflow=$DOGFOOD_RESULT"
          test "$ACCEPTANCE_IMAGE_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$SQLITE_RESULT" = success
          test "$MAC_LINUX_RESULT" = success
          test "$SERVICE_ACCEPTANCE_RESULT" = success
          test "$DOGFOOD_RESULT" = success
