name: acceptance-image-build

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact source commit represented by artifact names and receipts
        required: false
        type: string
        default: ""
      source_repository:
        description: Repository containing candidate_sha (including a fork for pull_request)
        required: false
        type: string
        default: ""
      package_releases:
        description: Assemble secretless multi-platform release artifacts for the realtiming lane
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
  IMAGE_NAME: ghcr.io/derek-x-wang/wefty-echo-service
  COMPUTER_IMAGE_NAME: ghcr.io/derek-x-wang/wefty-computer-reference
  WAYLAND_COMPUTER_IMAGE_NAME: ghcr.io/derek-x-wang/wefty-computer-wayland-reference

jobs:
  reproducible-platform-build:
    name: reproducible-platform-build / linux/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: [5000:5000]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
            network=host
      - name: Build with OCI and registry exporter shapes from empty caches
        env:
          PLATFORM: linux/${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          registry_reference="localhost:5000/wefty-echo-service:${CANDIDATE_SHA}-${ARCH}"
          docker buildx build --no-cache --platform "$PLATFORM" --provenance=false --sbom=false \
            --build-arg SOURCE_DATE_EPOCH=0 --file examples/oci-echo-service/Dockerfile \
            --output "type=oci,dest=$RUNNER_TEMP/acceptance-image.oci.tar,rewrite-timestamp=true" .
          docker buildx build --no-cache --platform "$PLATFORM" --provenance=false --sbom=false \
            --build-arg SOURCE_DATE_EPOCH=0 --file examples/oci-echo-service/Dockerfile \
            --output "type=registry,registry.insecure=true,name=$registry_reference,rewrite-timestamp=true" .
      - name: Prove reproducibility and execute the exact platform digest
        env:
          PLATFORM: linux/${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/acceptance-image-linux"
          mkdir -p "$evidence"
          scripts/verify-acceptance-image.sh --archive "$RUNNER_TEMP/acceptance-image.oci.tar" \
            --expected-platform "$PLATFORM" --platform-digest-output "$evidence/${ARCH}.digest" \
            --receipt-output "$evidence/${ARCH}-oci.json"
          cp "$RUNNER_TEMP/acceptance-image.oci.tar" "$evidence/${ARCH}.oci.tar"
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.0
          crane="$(go env GOPATH)/bin/crane"
          registry_reference="localhost:5000/wefty-echo-service:${CANDIDATE_SHA}-${ARCH}"
          platform_digest="$(cat "$evidence/${ARCH}.digest")"
          registry_digest="$("$crane" digest --insecure "$registry_reference")"
          test "$registry_digest" = "$platform_digest"
          printf '%s\n' "$registry_digest" > "$evidence/${ARCH}-registry.digest"

          pinned_reference="${registry_reference}@${platform_digest}"
          docker pull --platform "$PLATFORM" "$pinned_reference"
          container_id="$(docker run --detach --rm --platform "$PLATFORM" --network host \
            --env WEFTY_SERVICE_PORT=18156 --env WEFTY_SERVICE_DIR=/tmp/wefty-service "$pinned_reference")"
          cleanup() { docker stop --time 15 "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18156/healthz > "$evidence/${ARCH}-health.json"; then break; fi
            sleep 1
          done
          jq -e '.service_directory == "/tmp/wefty-service" and .listening_port == 18156 and (.pid > 0)' "$evidence/${ARCH}-health.json"
          printf 'wefty-public-echo-%s\n' "$ARCH" > "$evidence/${ARCH}-echo-input.txt"
          curl --fail --silent --request POST --data-binary "@$evidence/${ARCH}-echo-input.txt" \
            http://127.0.0.1:18156/echo > "$evidence/${ARCH}-echo-output.txt"
          cmp "$evidence/${ARCH}-echo-input.txt" "$evidence/${ARCH}-echo-output.txt"
          docker stop --time 15 "$container_id"
          trap - EXIT

          "$crane" export --insecure --platform "$PLATFORM" "$pinned_reference" "$RUNNER_TEMP/rootfs.tar"
          tar -xOf "$RUNNER_TEMP/rootfs.tar" usr/local/bin/wefty-echo-service > "$RUNNER_TEMP/wefty-echo-service"
          python3 - "$RUNNER_TEMP/wefty-echo-service" "$ARCH" <<'PY'
          import struct, sys
          payload = open(sys.argv[1], "rb").read(20)
          if payload[:4] != b"\x7fELF": raise SystemExit("echo service is not ELF")
          machine = struct.unpack("<H", payload[18:20])[0]
          expected = {"amd64": 62, "arm64": 183}[sys.argv[2]]
          if machine != expected: raise SystemExit(f"ELF e_machine={machine}, want {expected}")
          PY
          machine="$(test "$ARCH" = amd64 && printf 62 || printf 183)"
          jq -n --arg platform "$PLATFORM" --arg digest "$platform_digest" --argjson e_machine "$machine" \
            '{platform: $platform, digest: $digest, executed: true, health: true, echo: true, elf_e_machine: $e_machine}' \
            > "$evidence/${ARCH}-runtime.json"
      - name: Dry-run digest-only release manifest assembly
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/acceptance-image-release-linux-$ARCH"
          mkdir -p "$root/libexec" "$root/share/wefty/oci"
          CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build -trimpath -buildvcs=false -ldflags='-buildid=' \
            -o "$root/libexec/wefty-agent" ./cmd/wefty-agent
          synthetic_digest="sha256:$(printf 'a%.0s' {1..64})"
          scripts/build-oci-install-manifest.sh --helper "$root/libexec/wefty-agent" --probe-reference "$IMAGE_NAME" \
            --probe-digest "$synthetic_digest" --probe-archive "$RUNNER_TEMP/acceptance-image.oci.tar" \
            --output "$root/share/wefty/oci/manifest.json"
          jq -e --arg reference "$IMAGE_NAME" --arg digest "$synthetic_digest" '
            .probe_reference == $reference and .probe_digest == $digest
          ' "$root/share/wefty/oci/manifest.json"
      - name: Upload reproducibility and runtime evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wefty-echo-service-platform-${{ matrix.arch }}-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/acceptance-image-linux
          if-no-files-found: error

  reference-computer-platform-build:
    name: reference-computer-platform-build / ${{ matrix.variant }} / linux/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, variant: xfce, dockerfile: examples/computer/Dockerfile, local_name: wefty-computer-reference, artifact: wefty-computer-reference, edge: 'wefty-rfb-websocket --port', elf_path: usr/lib/chromium/chromium}
          - {arch: arm64, variant: xfce, dockerfile: examples/computer/Dockerfile, local_name: wefty-computer-reference, artifact: wefty-computer-reference, edge: 'wefty-rfb-websocket --port', elf_path: usr/lib/chromium/chromium}
          - {arch: amd64, variant: wayland, dockerfile: examples/computer-wayland/Dockerfile, local_name: wefty-computer-wayland-reference, artifact: wefty-computer-wayland-reference, edge: 'wayvnc -w', elf_path: usr/bin/wayvnc}
          - {arch: arm64, variant: wayland, dockerfile: examples/computer-wayland/Dockerfile, local_name: wefty-computer-wayland-reference, artifact: wefty-computer-wayland-reference, edge: 'wayvnc -w', elf_path: usr/bin/wayvnc}
    runs-on: ${{ matrix.arch == 'arm64' && matrix.variant == 'wayland' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: [5000:5000]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - if: matrix.arch != 'arm64' || matrix.variant != 'wayland'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
            network=host
      - name: Build the reference desktop into its execution shape
        env:
          PLATFORM: linux/${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          LOCAL_NAME: ${{ matrix.local_name }}
        run: |
          set -euo pipefail
          registry_reference="localhost:5000/${LOCAL_NAME}:${CANDIDATE_SHA}-${ARCH}"
          docker buildx build --no-cache --platform "$PLATFORM" --provenance=false --sbom=false \
            --build-arg SOURCE_DATE_EPOCH=0 --file "$DOCKERFILE" \
            --output "type=oci,dest=$RUNNER_TEMP/computer-image.oci.tar,rewrite-timestamp=true" .
          docker buildx build --no-cache --platform "$PLATFORM" --provenance=false --sbom=false \
            --build-arg SOURCE_DATE_EPOCH=0 --file "$DOCKERFILE" \
            --output "type=registry,registry.insecure=true,name=$registry_reference,rewrite-timestamp=true" .
      - name: Execute the exact desktop digest and assert its ELF architecture
        env:
          PLATFORM: linux/${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
          LOCAL_NAME: ${{ matrix.local_name }}
          EDGE_PROCESS_PATTERN: ${{ matrix.edge }}
          ELF_PATH: ${{ matrix.elf_path }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/computer-image-linux"
          mkdir -p "$evidence"
          scripts/verify-acceptance-image.sh --archive "$RUNNER_TEMP/computer-image.oci.tar" \
            --expected-platform "$PLATFORM" --platform-digest-output "$evidence/${ARCH}.digest" \
            --receipt-output "$evidence/${ARCH}-oci.json"
          cp "$RUNNER_TEMP/computer-image.oci.tar" "$evidence/${ARCH}.oci.tar"
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.0
          crane="$(go env GOPATH)/bin/crane"
          registry_reference="localhost:5000/${LOCAL_NAME}:${CANDIDATE_SHA}-${ARCH}"
          platform_digest="$(cat "$evidence/${ARCH}.digest")"
          registry_digest="$("$crane" digest --insecure "$registry_reference")"
          test "$registry_digest" = "$platform_digest"
          printf '%s\n' "$registry_digest" > "$evidence/${ARCH}-registry.digest"
          pinned_reference="${registry_reference}@${platform_digest}"
          docker pull --platform "$PLATFORM" "$pinned_reference"
          scripts/test-computer-image-runtime.sh --image "$pinned_reference" --arch "$ARCH" --evidence "$evidence" \
            --edge-process-pattern "$EDGE_PROCESS_PATTERN"
          if [[ $VARIANT == wayland ]]; then
            scripts/test-computer-wayland-furniture.sh --image "$pinned_reference" --arch "$ARCH" \
              --conformance-receipt "$evidence/${ARCH}-runtime.json" --output "$evidence/${ARCH}-furniture.json" \
              --metrics-output "$evidence/${ARCH}-metrics.json"
          else
            scripts/measure-computer-image.sh --image "$pinned_reference" --arch "$ARCH" \
              --conformance-receipt "$evidence/${ARCH}-runtime.json" --output "$evidence/${ARCH}-metrics.json"
          fi

          "$crane" export --insecure --platform "$PLATFORM" "$pinned_reference" "$RUNNER_TEMP/computer-rootfs.tar"
          tar -xOf "$RUNNER_TEMP/computer-rootfs.tar" "$ELF_PATH" > "$RUNNER_TEMP/computer-elf"
          python3 - "$RUNNER_TEMP/computer-elf" "$ARCH" <<'PY'
          import struct, sys
          payload = open(sys.argv[1], "rb").read(20)
          if payload[:4] != b"\x7fELF": raise SystemExit("reference desktop executable is not ELF")
          machine = struct.unpack("<H", payload[18:20])[0]
          expected = {"amd64": 62, "arm64": 183}[sys.argv[2]]
          if machine != expected: raise SystemExit(f"ELF e_machine={machine}, want {expected}")
          PY
          machine="$(test "$ARCH" = amd64 && printf 62 || printf 183)"
          jq --arg digest "$platform_digest" --argjson e_machine "$machine" \
            '.digest = $digest | .elf_e_machine = $e_machine' "$evidence/${ARCH}-runtime.json" \
            > "$evidence/${ARCH}-runtime.complete.json"
          mv "$evidence/${ARCH}-runtime.complete.json" "$evidence/${ARCH}-runtime.json"
      - name: Upload reference desktop evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}-platform-${{ matrix.arch }}-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/computer-image-linux
          if-no-files-found: error

  package-pr-releases:
    name: package-pr-releases
    if: inputs.package_releases
    needs: [reproducible-platform-build, reference-computer-platform-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Download the PR-built platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wefty-*-platform-*-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/platform-artifacts
      - name: Assemble the echo release without a registry
        run: |
          set -euo pipefail
          platforms="$RUNNER_TEMP/platform-artifacts"
          echo_platforms="$RUNNER_TEMP/echo-platforms"
          mkdir -p "$echo_platforms"
          for arch in amd64 arm64; do
            cp "$platforms/wefty-echo-service-platform-$arch-$CANDIDATE_SHA/$arch."* \
              "$platforms/wefty-echo-service-platform-$arch-$CANDIDATE_SHA/${arch}-"* "$echo_platforms/"
          done
          archive="$RUNNER_TEMP/wefty-echo-service.oci.tar"
          scripts/assemble-oci-index.sh --reference "$IMAGE_NAME" --output "$archive" \
            --index-output "$RUNNER_TEMP/acceptance-image-index.json" \
            --digest-output "$RUNNER_TEMP/acceptance-image-index-digest.txt" \
            --image "linux/amd64=$echo_platforms/amd64.oci.tar" \
            --image "linux/arm64=$echo_platforms/arm64.oci.tar"
          index_digest="$(cat "$RUNNER_TEMP/acceptance-image-index-digest.txt")"
          scripts/verify-acceptance-image.sh --archive "$archive" --expected-top-digest "$index_digest" \
            --expected-platform linux/amd64 --expected-platform linux/arm64 \
            --expected-platform-digest "linux/amd64=$(cat "$echo_platforms/amd64.digest")" \
            --expected-platform-digest "linux/arm64=$(cat "$echo_platforms/arm64.digest")" \
            --receipt-output "$RUNNER_TEMP/acceptance-image-archive-receipt.json"
          jq -e --arg digest "$(cat "$echo_platforms/amd64.digest")" '.digest == $digest and .executed and .health and .echo and .elf_e_machine == 62' "$echo_platforms/amd64-runtime.json"
          jq -e --arg digest "$(cat "$echo_platforms/arm64.digest")" '.digest == $digest and .executed and .health and .echo and .elf_e_machine == 183' "$echo_platforms/arm64-runtime.json"

          release="$RUNNER_TEMP/acceptance-image-release"
          package="$RUNNER_TEMP/acceptance-image-package"
          mkdir -p "$release" "$package"
          cp "$archive" "$release/wefty-echo-service.oci.tar"
          for arch in amd64 arm64; do
            root="$release/linux-$arch"
            mkdir -p "$root/bin" "$root/libexec" "$root/share/wefty/oci"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags='-buildid=' -o "$root/bin/wefty" ./cmd/wefty
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags='-buildid=' -o "$root/libexec/wefty-agent" ./cmd/wefty-agent
            scripts/build-oci-install-manifest.sh --helper "$root/libexec/wefty-agent" --probe-reference "$IMAGE_NAME" \
              --probe-digest "$index_digest" --probe-archive "$release/wefty-echo-service.oci.tar" \
              --output "$root/share/wefty/oci/manifest.json"
            rm "$root/share/wefty/oci/wefty-echo-service.oci.tar"
            ln "$release/wefty-echo-service.oci.tar" "$root/share/wefty/oci/wefty-echo-service.oci.tar"
          done
          cp "$RUNNER_TEMP/acceptance-image-index.json" "$release/"
          cp "$RUNNER_TEMP/acceptance-image-index-digest.txt" "$release/"
          cp "$RUNNER_TEMP/acceptance-image-archive-receipt.json" "$release/"
          jq -n --arg commit "$CANDIDATE_SHA" --arg reference "$IMAGE_NAME" --arg index_digest "$index_digest" \
            --arg amd64_digest "$(cat "$echo_platforms/amd64.digest")" --arg arm64_digest "$(cat "$echo_platforms/arm64.digest")" \
            '{version:1,source:"pr-build",commit:$commit,reference:$reference,index_digest:$index_digest,platforms:{"linux/amd64":$amd64_digest,"linux/arm64":$arm64_digest},public_pull:false,archive_verified:true,runtime_verified:{"linux/amd64":true,"linux/arm64":true}}' \
            > "$release/acceptance-image-receipt.json"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP" \
            -cf "$package/wefty-acceptance-image-release.tar" acceptance-image-release
      - name: Assemble both Computer releases without a registry
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # $digest and $id are jq variables.
          receipt_assertion='def pass($id): ([.checks[] | select(.id == $id and .status == "PASS")] | length) == 1; .digest == $digest and .image_status == "PASS" and .harness_status == "PASS" and .containerd_profile_status == "NOT-RUN" and (.checks | length) == 60 and pass("transport.view-ready") and pass("transport.control-ready") and pass("transport.text-frame-rejected") and pass("input.view-isolated") and pass("input.view-isolated-during-tenure") and pass("input.control-accepted") and pass("driver.true-consumed") and pass("driver.release-consumed") and pass("persistence.profile-survives") and pass("persistence.sign-in-survives") and pass("persistence.edge-recovers") and ([.checks[] | select(.scope != "containerd-profile" and .status != "PASS")] | length) == 0 and ([.checks[] | select(.scope == "containerd-profile" and .status != "NOT-RUN")] | length) == 0 and .readiness_seconds < 60'
          furniture_assertion='.gpu_device_absent == true and .native_wayvnc_websocket == true and .view_disable_input == true and .agent_states_observed == ["idle","working","blocked","done"] and .self_reconfiguration_observed == true and .crash_briefing_observed == true and .mise_stubs_present == true and .license_manifest_present == true and .idle_rss_bytes > 0 and (.cold_start_seconds | type) == "number" and .cold_start_seconds < 60'
          for variant in xfce wayland; do
            if [ "$variant" = wayland ]; then
              artifact=wefty-computer-wayland-reference
              reference="$WAYLAND_COMPUTER_IMAGE_NAME"
              prefix=wayland-computer
              release_dir=wayland-computer-image-release
            else
              artifact=wefty-computer-reference
              reference="$COMPUTER_IMAGE_NAME"
              prefix=computer
              release_dir=computer-image-release
            fi
            source_root="$RUNNER_TEMP/platform-artifacts"
            platform_root="$RUNNER_TEMP/$prefix-platforms"
            mkdir -p "$platform_root"
            for arch in amd64 arm64; do
              cp "$source_root/$artifact-platform-$arch-$CANDIDATE_SHA/$arch."* \
                "$source_root/$artifact-platform-$arch-$CANDIDATE_SHA/${arch}-"* "$platform_root/"
            done
            archive="$RUNNER_TEMP/$artifact.oci.tar"
            scripts/assemble-oci-index.sh --reference "$reference" --output "$archive" \
              --index-output "$RUNNER_TEMP/$prefix-image-index.json" \
              --digest-output "$RUNNER_TEMP/$prefix-image-index-digest.txt" \
              --image "linux/amd64=$platform_root/amd64.oci.tar" \
              --image "linux/arm64=$platform_root/arm64.oci.tar"
            index_digest="$(cat "$RUNNER_TEMP/$prefix-image-index-digest.txt")"
            scripts/verify-acceptance-image.sh --archive "$archive" --expected-top-digest "$index_digest" \
              --expected-platform linux/amd64 --expected-platform linux/arm64 \
              --expected-platform-digest "linux/amd64=$(cat "$platform_root/amd64.digest")" \
              --expected-platform-digest "linux/arm64=$(cat "$platform_root/arm64.digest")" \
              --receipt-output "$RUNNER_TEMP/$prefix-image-archive-receipt.json"
            jq -e --arg digest "$(cat "$platform_root/amd64.digest")" "$receipt_assertion and .elf_e_machine == 62" "$platform_root/amd64-runtime.json"
            jq -e --arg digest "$(cat "$platform_root/arm64.digest")" "$receipt_assertion and .elf_e_machine == 183" "$platform_root/arm64-runtime.json"
            if [ "$variant" = wayland ]; then
              jq -e "$furniture_assertion" "$platform_root/amd64-furniture.json"
              jq -e "$furniture_assertion" "$platform_root/arm64-furniture.json"
            fi

            release="$RUNNER_TEMP/$release_dir"
            package="$RUNNER_TEMP/$prefix-image-package"
            mkdir -p "$release" "$package"
            cp "$archive" "$release/"
            cp "$RUNNER_TEMP/$prefix-image-index.json" "$release/"
            cp "$RUNNER_TEMP/$prefix-image-index-digest.txt" "$release/"
            cp "$RUNNER_TEMP/$prefix-image-archive-receipt.json" "$release/"
            for arch in amd64 arm64; do
              cp "$platform_root/$arch-runtime.json" "$release/$arch-runtime.json"
              cp "$platform_root/$arch-metrics.json" "$release/$arch-metrics.json"
              if [ "$variant" = wayland ]; then cp "$platform_root/$arch-furniture.json" "$release/$arch-furniture.json"; fi
            done
            jq -n --arg commit "$CANDIDATE_SHA" --arg reference "$reference" --arg index_digest "$index_digest" \
              --arg amd64_digest "$(cat "$platform_root/amd64.digest")" --arg arm64_digest "$(cat "$platform_root/arm64.digest")" --arg variant "$variant" \
              '{version:1,source:"pr-build",commit:$commit,reference:$reference,index_digest:$index_digest,platforms:{"linux/amd64":$amd64_digest,"linux/arm64":$arm64_digest},public_pull:false,archive_verified:true,runtime_verified:{"linux/amd64":true,"linux/arm64":true}} + (if $variant == "wayland" then {furniture_verified:{"linux/amd64":true,"linux/arm64":true}} else {} end)' \
              > "$release/$prefix-image-receipt.json"
            tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP" \
              -cf "$package/$artifact-release.tar" "$release_dir"
          done
      - name: Upload the PR-built echo release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wefty-echo-service-${{ env.CANDIDATE_SHA }}
