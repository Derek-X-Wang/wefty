name: acceptance-image

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: acceptance-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/derek-x-wang/wefty-echo-service
  COMPUTER_IMAGE_NAME: ghcr.io/derek-x-wang/wefty-computer-reference
  WAYLAND_COMPUTER_IMAGE_NAME: ghcr.io/derek-x-wang/wefty-computer-wayland-reference

jobs:
  reproducible-platform-build:
    name: reproducible-platform-build / linux/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: [5000:5000]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
            network=host
      - name: Build with OCI and registry exporter shapes from empty caches
        env:
          PLATFORM: linux/${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          registry_reference="localhost:5000/wefty-echo-service:${GITHUB_SHA}-${ARCH}"
          docker buildx build --no-cache --platform "$PLATFORM" --provenance=false --sbom=false \
            --build-arg SOURCE_DATE_EPOCH=0 --file examples/oci-echo-service/Dockerfile \
            --output "type=oci,dest=$RUNNER_TEMP/acceptance-image.oci.tar,rewrite-timestamp=true" .
          docker buildx build --no-cache --platform "$PLATFORM" --provenance=false --sbom=false \
            --build-arg SOURCE_DATE_EPOCH=0 --file examples/oci-echo-service/Dockerfile \
            --output "type=registry,registry.insecure=true,name=$registry_reference,rewrite-timestamp=true" .
      - name: Prove reproducibility and execute the exact platform digest
        env:
          PLATFORM: linux/${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/acceptance-image-linux"
          mkdir -p "$evidence"
          scripts/verify-acceptance-image.sh --archive "$RUNNER_TEMP/acceptance-image.oci.tar" \
            --expected-platform "$PLATFORM" --platform-digest-output "$evidence/${ARCH}.digest" \
            --receipt-output "$evidence/${ARCH}-oci.json"
          cp "$RUNNER_TEMP/acceptance-image.oci.tar" "$evidence/${ARCH}.oci.tar"
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.0
          crane="$(go env GOPATH)/bin/crane"
          registry_reference="localhost:5000/wefty-echo-service:${GITHUB_SHA}-${ARCH}"
          platform_digest="$(cat "$evidence/${ARCH}.digest")"
          registry_digest="$("$crane" digest --insecure "$registry_reference")"
          test "$registry_digest" = "$platform_digest"
          printf '%s\n' "$registry_digest" > "$evidence/${ARCH}-registry.digest"

          pinned_reference="${registry_reference}@${platform_digest}"
          docker pull --platform "$PLATFORM" "$pinned_reference"
          container_id="$(docker run --detach --rm --platform "$PLATFORM" --network host \
            --env WEFTY_SERVICE_PORT=18156 --env WEFTY_SERVICE_DIR=/tmp/wefty-service "$pinned_reference")"
          cleanup() { docker stop --time 15 "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18156/healthz > "$evidence/${ARCH}-health.json"; then break; fi
            sleep 1
          done
          jq -e '.service_directory == "/tmp/wefty-service" and .listening_port == 18156 and (.pid > 0)' "$evidence/${ARCH}-health.json"
          printf 'wefty-public-echo-%s\n' "$ARCH" > "$evidence/${ARCH}-echo-input.txt"
          curl --fail --silent --request POST --data-binary "@$evidence/${ARCH}-echo-input.txt" \
            http://127.0.0.1:18156/echo > "$evidence/${ARCH}-echo-output.txt"
          cmp "$evidence/${ARCH}-echo-input.txt" "$evidence/${ARCH}-echo-output.txt"
          docker stop --time 15 "$container_id"
          trap - EXIT

          "$crane" export --insecure --platform "$PLATFORM" "$pinned_reference" "$RUNNER_TEMP/rootfs.tar"
          tar -xOf "$RUNNER_TEMP/rootfs.tar" usr/local/bin/wefty-echo-service > "$RUNNER_TEMP/wefty-echo-service"
          python3 - "$RUNNER_TEMP/wefty-echo-service" "$ARCH" <<'PY'
          import struct, sys
          payload = open(sys.argv[1], "rb").read(20)
          if payload[:4] != b"\x7fELF": raise SystemExit("echo service is not ELF")
          machine = struct.unpack("<H", payload[18:20])[0]
          expected = {"amd64": 62, "arm64": 183}[sys.argv[2]]
          if machine != expected: raise SystemExit(f"ELF e_machine={machine}, want {expected}")
          PY
          machine="$(test "$ARCH" = amd64 && printf 62 || printf 183)"
          jq -n --arg platform "$PLATFORM" --arg digest "$platform_digest" --argjson e_machine "$machine" \
            '{platform: $platform, digest: $digest, executed: true, health: true, echo: true, elf_e_machine: $e_machine}' \
            > "$evidence/${ARCH}-runtime.json"
      - name: Upload reproducibility and runtime evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wefty-echo-service-platform-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/acceptance-image-linux
          if-no-files-found: error

  publish:
    name: publish-public-index-and-archive
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [reproducible-platform-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      index-digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Download platform digest evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wefty-echo-service-platform-*-${{ github.sha }}
          path: ${{ runner.temp }}/platforms
          merge-multiple: true
      - name: Authenticate the main-only publisher
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the commit-tagged multi-platform index
        id: publish
        run: |
          set -euo pipefail
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.0
          crane="$(go env GOPATH)/bin/crane"
          for arch in amd64 arm64; do
            layout="$RUNNER_TEMP/echo-$arch.oci"
            mkdir -p "$layout"
            tar -xf "$RUNNER_TEMP/platforms/$arch.oci.tar" -C "$layout"
            "$crane" push "$layout" "$IMAGE_NAME:${GITHUB_SHA}-${arch}"
            test "$("$crane" digest "$IMAGE_NAME:${GITHUB_SHA}-${arch}")" = "$(cat "$RUNNER_TEMP/platforms/$arch.digest")"
          done
          "$crane" index append \
            -m "$IMAGE_NAME@$(cat "$RUNNER_TEMP/platforms/amd64.digest")" \
            -m "$IMAGE_NAME@$(cat "$RUNNER_TEMP/platforms/arm64.digest")" \
            -t "$IMAGE_NAME:$GITHUB_SHA"
          index_digest="$("$crane" digest "$IMAGE_NAME:$GITHUB_SHA")"
          printf '%s\n' "digest=$index_digest" >> "$GITHUB_OUTPUT"
      - name: Resolve the published digest once and verify its platform set
        env:
          ACTION_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          crane="$(go env GOPATH)/bin/crane"
          index_digest="$("$crane" digest "$IMAGE_NAME:$GITHUB_SHA")"
          test "$index_digest" = "$ACTION_DIGEST"
          printf '%s\n' "$index_digest" > "$RUNNER_TEMP/acceptance-image-index-digest.txt"
          "$crane" manifest "$IMAGE_NAME@$index_digest" > "$RUNNER_TEMP/acceptance-image-index.json"
          amd64_digest="$(cat "$RUNNER_TEMP/platforms/amd64.digest")"
          arm64_digest="$(cat "$RUNNER_TEMP/platforms/arm64.digest")"
          test "$(jq -r --arg digest "$amd64_digest" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64" and .digest == $digest)] | length' "$RUNNER_TEMP/acceptance-image-index.json")" = 1
          test "$(jq -r --arg digest "$arm64_digest" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64" and .digest == $digest)] | length' "$RUNNER_TEMP/acceptance-image-index.json")" = 1
          test "$(jq -r '[.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64"))] | length' "$RUNNER_TEMP/acceptance-image-index.json")" = 2
          jq -e --arg digest "$amd64_digest" '.digest == $digest and .executed and .health and .echo and .elf_e_machine == 62' "$RUNNER_TEMP/platforms/amd64-runtime.json"
          jq -e --arg digest "$arm64_digest" '.digest == $digest and .executed and .health and .echo and .elf_e_machine == 183' "$RUNNER_TEMP/platforms/arm64-runtime.json"
      - name: Emit the digest-selected OCI archive and public-pull proof
        run: |
          set -euo pipefail
          crane="$(go env GOPATH)/bin/crane"
          index_digest="$(cat "$RUNNER_TEMP/acceptance-image-index-digest.txt")"
          layout="$RUNNER_TEMP/wefty-echo-service.oci"
          archive="$RUNNER_TEMP/wefty-echo-service.oci.tar"
          "$crane" pull "$IMAGE_NAME@$index_digest" "$layout" --format=oci --annotate-ref
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$layout" -cf "$archive" .
          scripts/verify-acceptance-image.sh --archive "$archive" --expected-top-digest "$index_digest" \
            --expected-platform linux/amd64 --expected-platform linux/arm64 \
            --expected-platform-digest "linux/amd64=$(cat "$RUNNER_TEMP/platforms/amd64.digest")" \
            --expected-platform-digest "linux/arm64=$(cat "$RUNNER_TEMP/platforms/arm64.digest")" \
            --receipt-output "$RUNNER_TEMP/acceptance-image-archive-receipt.json"
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          if ! DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker" "$crane" manifest "$IMAGE_NAME@$index_digest" >/dev/null; then
            printf '%s\n' '::error title=Public GHCR verification failed::Set the repository-linked wefty-echo-service package visibility to Public, then rerun acceptance-image.' >&2
            exit 1
          fi
      - name: Assemble digest-pinned runnable release trees
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/acceptance-image-release"
          index_digest="$(cat "$RUNNER_TEMP/acceptance-image-index-digest.txt")"
          mkdir -p "$release"
          cp "$RUNNER_TEMP/wefty-echo-service.oci.tar" "$release/wefty-echo-service.oci.tar"
          for arch in amd64 arm64; do
            root="$release/linux-$arch"
            mkdir -p "$root/bin" "$root/libexec" "$root/share/wefty/oci"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags='-buildid=' -o "$root/bin/wefty" ./cmd/wefty
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags='-buildid=' -o "$root/libexec/wefty-agent" ./cmd/wefty-agent
            scripts/build-oci-install-manifest.sh --helper "$root/libexec/wefty-agent" --probe-reference "$IMAGE_NAME" \
              --probe-digest "$index_digest" --probe-archive "$release/wefty-echo-service.oci.tar" \
              --output "$root/share/wefty/oci/manifest.json"
            rm "$root/share/wefty/oci/wefty-echo-service.oci.tar"
            ln "$release/wefty-echo-service.oci.tar" "$root/share/wefty/oci/wefty-echo-service.oci.tar"
          done
          cp "$RUNNER_TEMP/acceptance-image-index.json" "$release/acceptance-image-index.json"
          cp "$RUNNER_TEMP/acceptance-image-archive-receipt.json" "$release/acceptance-image-archive-receipt.json"
          cp "$RUNNER_TEMP/acceptance-image-index-digest.txt" "$release/acceptance-image-index-digest.txt"
          jq -n --arg commit "$GITHUB_SHA" --arg reference "$IMAGE_NAME" --arg index_digest "$index_digest" \
            --arg amd64_digest "$(cat "$RUNNER_TEMP/platforms/amd64.digest")" --arg arm64_digest "$(cat "$RUNNER_TEMP/platforms/arm64.digest")" \
            '{version: 1, commit: $commit, reference: $reference, index_digest: $index_digest, platforms: {"linux/amd64": $amd64_digest, "linux/arm64": $arm64_digest}, public_pull: true, archive_verified: true, runtime_verified: {"linux/amd64": true, "linux/arm64": true}}' \
            > "$release/acceptance-image-receipt.json"
          package="$RUNNER_TEMP/acceptance-image-package"
          mkdir -p "$package"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP" \
            -cf "$package/wefty-acceptance-image-release.tar" acceptance-image-release
      - name: Upload stable acceptance image outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wefty-echo-service-${{ github.sha }}
          path: ${{ runner.temp }}/acceptance-image-package
          if-no-files-found: error

  reference-computer-platform-build:
    name: reference-computer-platform-build / ${{ matrix.variant }} / linux/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, variant: xfce, dockerfile: examples/computer/Dockerfile, local_name: wefty-computer-reference, artifact: wefty-computer-reference, edge: 'wefty-rfb-websocket --port', elf_path: usr/lib/chromium/chromium}
          - {arch: arm64, variant: xfce, dockerfile: examples/computer/Dockerfile, local_name: wefty-computer-reference, artifact: wefty-computer-reference, edge: 'wefty-rfb-websocket --port', elf_path: usr/lib/chromium/chromium}
          - {arch: amd64, variant: wayland, dockerfile: examples/computer-wayland/Dockerfile, local_name: wefty-computer-wayland-reference, artifact: wefty-computer-wayland-reference, edge: 'wayvnc -w', elf_path: usr/bin/wayvnc}
          - {arch: arm64, variant: wayland, dockerfile: examples/computer-wayland/Dockerfile, local_name: wefty-computer-wayland-reference, artifact: wefty-computer-wayland-reference, edge: 'wayvnc -w', elf_path: usr/bin/wayvnc}
    runs-on: ${{ matrix.arch == 'arm64' && matrix.variant == 'wayland' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: [5000:5000]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - if: matrix.arch != 'arm64' || matrix.variant != 'wayland'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
            network=host
      - name: Build the reference desktop into its execution shape
        env:
          PLATFORM: linux/${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          LOCAL_NAME: ${{ matrix.local_name }}
        run: |
          set -euo pipefail
          registry_reference="localhost:5000/${LOCAL_NAME}:${GITHUB_SHA}-${ARCH}"
          docker buildx build --no-cache --platform "$PLATFORM" --provenance=false --sbom=false \
            --build-arg SOURCE_DATE_EPOCH=0 --file "$DOCKERFILE" \
            --output "type=oci,dest=$RUNNER_TEMP/computer-image.oci.tar,rewrite-timestamp=true" .
          if [[ $VARIANT == xfce ]]; then
            docker buildx build --no-cache --platform "$PLATFORM" --provenance=false --sbom=false \
              --build-arg SOURCE_DATE_EPOCH=0 --file "$DOCKERFILE" \
              --output "type=registry,registry.insecure=true,name=$registry_reference,rewrite-timestamp=true" .
          else
            go install github.com/google/go-containerregistry/cmd/crane@v0.22.0
            layout="$RUNNER_TEMP/computer-image.oci"
            mkdir -p "$layout"
            tar -xf "$RUNNER_TEMP/computer-image.oci.tar" -C "$layout"
            "$(go env GOPATH)/bin/crane" push --insecure "$layout" "$registry_reference"
          fi
      - name: Execute the exact desktop digest and assert its ELF architecture
        env:
          PLATFORM: linux/${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
          LOCAL_NAME: ${{ matrix.local_name }}
          EDGE_PROCESS_PATTERN: ${{ matrix.edge }}
          ELF_PATH: ${{ matrix.elf_path }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/computer-image-linux"
          mkdir -p "$evidence"
          scripts/verify-acceptance-image.sh --archive "$RUNNER_TEMP/computer-image.oci.tar" \
            --expected-platform "$PLATFORM" --platform-digest-output "$evidence/${ARCH}.digest" \
            --receipt-output "$evidence/${ARCH}-oci.json"
          cp "$RUNNER_TEMP/computer-image.oci.tar" "$evidence/${ARCH}.oci.tar"
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.0
          crane="$(go env GOPATH)/bin/crane"
          registry_reference="localhost:5000/${LOCAL_NAME}:${GITHUB_SHA}-${ARCH}"
          platform_digest="$(cat "$evidence/${ARCH}.digest")"
          registry_digest="$("$crane" digest --insecure "$registry_reference")"
          test "$registry_digest" = "$platform_digest"
          printf '%s\n' "$registry_digest" > "$evidence/${ARCH}-registry.digest"
          pinned_reference="${registry_reference}@${platform_digest}"
          docker pull --platform "$PLATFORM" "$pinned_reference"
          scripts/test-computer-image-runtime.sh --image "$pinned_reference" --arch "$ARCH" --evidence "$evidence" \
            --edge-process-pattern "$EDGE_PROCESS_PATTERN"
          scripts/measure-computer-image.sh --image "$pinned_reference" --arch "$ARCH" \
            --conformance-receipt "$evidence/${ARCH}-runtime.json" --output "$evidence/${ARCH}-metrics.json"
          if [[ $VARIANT == wayland ]]; then
            scripts/test-computer-wayland-furniture.sh --image "$pinned_reference" --arch "$ARCH" \
              --conformance-receipt "$evidence/${ARCH}-runtime.json" --output "$evidence/${ARCH}-furniture.json"
          fi

          "$crane" export --insecure --platform "$PLATFORM" "$pinned_reference" "$RUNNER_TEMP/computer-rootfs.tar"
          tar -xOf "$RUNNER_TEMP/computer-rootfs.tar" "$ELF_PATH" > "$RUNNER_TEMP/computer-elf"
          python3 - "$RUNNER_TEMP/computer-elf" "$ARCH" <<'PY'
          import struct, sys
          payload = open(sys.argv[1], "rb").read(20)
          if payload[:4] != b"\x7fELF": raise SystemExit("reference desktop executable is not ELF")
          machine = struct.unpack("<H", payload[18:20])[0]
          expected = {"amd64": 62, "arm64": 183}[sys.argv[2]]
          if machine != expected: raise SystemExit(f"ELF e_machine={machine}, want {expected}")
          PY
          machine="$(test "$ARCH" = amd64 && printf 62 || printf 183)"
          jq --arg digest "$platform_digest" --argjson e_machine "$machine" \
            '.digest = $digest | .elf_e_machine = $e_machine' "$evidence/${ARCH}-runtime.json" \
            > "$evidence/${ARCH}-runtime.complete.json"
          mv "$evidence/${ARCH}-runtime.complete.json" "$evidence/${ARCH}-runtime.json"
      - name: Upload reference desktop evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}-platform-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/computer-image-linux
          if-no-files-found: error

  publish-reference-computer:
    name: publish-reference-computer-index-and-archive
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [reference-computer-platform-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Download executed platform evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wefty-computer-reference-platform-*-${{ github.sha }}
          path: ${{ runner.temp }}/computer-platforms
          merge-multiple: true
      - name: Authenticate the main-only reference desktop publisher
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the commit-tagged reference desktop index
        id: publish-computer
        run: |
          set -euo pipefail
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.0
          crane="$(go env GOPATH)/bin/crane"
          for arch in amd64 arm64; do
            layout="$RUNNER_TEMP/computer-$arch.oci"
            mkdir -p "$layout"
            tar -xf "$RUNNER_TEMP/computer-platforms/$arch.oci.tar" -C "$layout"
            "$crane" push "$layout" "$COMPUTER_IMAGE_NAME:${GITHUB_SHA}-${arch}"
            test "$("$crane" digest "$COMPUTER_IMAGE_NAME:${GITHUB_SHA}-${arch}")" = "$(cat "$RUNNER_TEMP/computer-platforms/$arch.digest")"
          done
          "$crane" index append \
            -m "$COMPUTER_IMAGE_NAME@$(cat "$RUNNER_TEMP/computer-platforms/amd64.digest")" \
            -m "$COMPUTER_IMAGE_NAME@$(cat "$RUNNER_TEMP/computer-platforms/arm64.digest")" \
            -t "$COMPUTER_IMAGE_NAME:$GITHUB_SHA"
          index_digest="$("$crane" digest "$COMPUTER_IMAGE_NAME:$GITHUB_SHA")"
          printf '%s\n' "digest=$index_digest" >> "$GITHUB_OUTPUT"
      - name: Bind the public index to the executed platform bytes
        env:
          ACTION_DIGEST: ${{ steps.publish-computer.outputs.digest }}
        run: |
          set -euo pipefail
          crane="$(go env GOPATH)/bin/crane"
          index_digest="$("$crane" digest "$COMPUTER_IMAGE_NAME:$GITHUB_SHA")"
          test "$index_digest" = "$ACTION_DIGEST"
          printf '%s\n' "$index_digest" > "$RUNNER_TEMP/computer-image-index-digest.txt"
          "$crane" manifest "$COMPUTER_IMAGE_NAME@$index_digest" > "$RUNNER_TEMP/computer-image-index.json"
          amd64_digest="$(cat "$RUNNER_TEMP/computer-platforms/amd64.digest")"
          arm64_digest="$(cat "$RUNNER_TEMP/computer-platforms/arm64.digest")"
          test "$(jq -r --arg digest "$amd64_digest" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64" and .digest == $digest)] | length' "$RUNNER_TEMP/computer-image-index.json")" = 1
          test "$(jq -r --arg digest "$arm64_digest" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64" and .digest == $digest)] | length' "$RUNNER_TEMP/computer-image-index.json")" = 1
          test "$(jq -r '[.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64"))] | length' "$RUNNER_TEMP/computer-image-index.json")" = 2
          # shellcheck disable=SC2016 # $digest is a jq variable, not a shell expansion.
          receipt_assertion='.digest == $digest and .image_status == "PASS" and .harness_status == "PASS" and .containerd_profile_status == "NOT-RUN" and ([.checks[] | select(.scope != "containerd-profile" and .status != "PASS")] | length) == 0 and ([.checks[] | select(.scope == "containerd-profile" and .status != "NOT-RUN")] | length) == 0 and .readiness_seconds < 60'
          jq -e --arg digest "$amd64_digest" "$receipt_assertion and .elf_e_machine == 62" "$RUNNER_TEMP/computer-platforms/amd64-runtime.json"
          jq -e --arg digest "$arm64_digest" "$receipt_assertion and .elf_e_machine == 183" "$RUNNER_TEMP/computer-platforms/arm64-runtime.json"
      - name: Emit the digest-selected Computer OCI archive
        run: |
          set -euo pipefail
          crane="$(go env GOPATH)/bin/crane"
          index_digest="$(cat "$RUNNER_TEMP/computer-image-index-digest.txt")"
          layout="$RUNNER_TEMP/wefty-computer-reference.oci"
          archive="$RUNNER_TEMP/wefty-computer-reference.oci.tar"
          "$crane" pull "$COMPUTER_IMAGE_NAME@$index_digest" "$layout" --format=oci --annotate-ref
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$layout" -cf "$archive" .
          scripts/verify-acceptance-image.sh --archive "$archive" --expected-top-digest "$index_digest" \
            --expected-platform linux/amd64 --expected-platform linux/arm64 \
            --expected-platform-digest "linux/amd64=$(cat "$RUNNER_TEMP/computer-platforms/amd64.digest")" \
            --expected-platform-digest "linux/arm64=$(cat "$RUNNER_TEMP/computer-platforms/arm64.digest")" \
            --receipt-output "$RUNNER_TEMP/computer-image-archive-receipt.json"
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          if ! DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker" "$crane" manifest "$COMPUTER_IMAGE_NAME@$index_digest" >/dev/null; then
            printf '%s\n' '::error title=Public GHCR verification failed::Set the repository-linked wefty-computer-reference package visibility to Public, then rerun acceptance-image.' >&2
            exit 1
          fi
      - name: Assemble the separate Computer release artifact
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/computer-image-release"
          package="$RUNNER_TEMP/computer-image-package"
          index_digest="$(cat "$RUNNER_TEMP/computer-image-index-digest.txt")"
          mkdir -p "$release" "$package"
          cp "$RUNNER_TEMP/wefty-computer-reference.oci.tar" "$release/"
          cp "$RUNNER_TEMP/computer-image-index.json" "$release/"
          cp "$RUNNER_TEMP/computer-image-index-digest.txt" "$release/"
          cp "$RUNNER_TEMP/computer-image-archive-receipt.json" "$release/"
          cp "$RUNNER_TEMP/computer-platforms/amd64-runtime.json" "$release/amd64-runtime.json"
          cp "$RUNNER_TEMP/computer-platforms/arm64-runtime.json" "$release/arm64-runtime.json"
          cp "$RUNNER_TEMP/computer-platforms/amd64-metrics.json" "$release/amd64-metrics.json"
          cp "$RUNNER_TEMP/computer-platforms/arm64-metrics.json" "$release/arm64-metrics.json"
          jq -n --arg commit "$GITHUB_SHA" --arg reference "$COMPUTER_IMAGE_NAME" --arg index_digest "$index_digest" \
            --arg amd64_digest "$(cat "$RUNNER_TEMP/computer-platforms/amd64.digest")" --arg arm64_digest "$(cat "$RUNNER_TEMP/computer-platforms/arm64.digest")" \
            '{version: 1, commit: $commit, reference: $reference, index_digest: $index_digest, platforms: {"linux/amd64": $amd64_digest, "linux/arm64": $arm64_digest}, public_pull: true, archive_verified: true, runtime_verified: {"linux/amd64": true, "linux/arm64": true}}' \
            > "$release/computer-image-receipt.json"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP" \
            -cf "$package/wefty-computer-reference-release.tar" computer-image-release
      - name: Upload stable Computer image outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wefty-computer-reference-${{ github.sha }}
          path: ${{ runner.temp }}/computer-image-package
          if-no-files-found: error

  publish-wayland-reference-computer:
    name: publish-wayland-reference-computer-index-and-archive
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [reference-computer-platform-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Download executed Wayland platform evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wefty-computer-wayland-reference-platform-*-${{ github.sha }}
          path: ${{ runner.temp }}/wayland-computer-platforms
          merge-multiple: true
      - name: Authenticate the main-only Wayland desktop publisher
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote the executed Wayland archives into a multi-platform index
        id: publish-wayland-computer
        run: |
          set -euo pipefail
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.0
          crane="$(go env GOPATH)/bin/crane"
          for arch in amd64 arm64; do
            layout="$RUNNER_TEMP/wayland-computer-$arch.oci"
            mkdir -p "$layout"
            tar -xf "$RUNNER_TEMP/wayland-computer-platforms/$arch.oci.tar" -C "$layout"
            "$crane" push "$layout" "$WAYLAND_COMPUTER_IMAGE_NAME:${GITHUB_SHA}-${arch}"
            test "$("$crane" digest "$WAYLAND_COMPUTER_IMAGE_NAME:${GITHUB_SHA}-${arch}")" = "$(cat "$RUNNER_TEMP/wayland-computer-platforms/$arch.digest")"
          done
          "$crane" index append \
            -m "$WAYLAND_COMPUTER_IMAGE_NAME@$(cat "$RUNNER_TEMP/wayland-computer-platforms/amd64.digest")" \
            -m "$WAYLAND_COMPUTER_IMAGE_NAME@$(cat "$RUNNER_TEMP/wayland-computer-platforms/arm64.digest")" \
            -t "$WAYLAND_COMPUTER_IMAGE_NAME:$GITHUB_SHA"
          index_digest="$("$crane" digest "$WAYLAND_COMPUTER_IMAGE_NAME:$GITHUB_SHA")"
          printf '%s\n' "digest=$index_digest" >> "$GITHUB_OUTPUT"
      - name: Bind the Wayland index to conformance, furniture, and ELF evidence
        env:
          ACTION_DIGEST: ${{ steps.publish-wayland-computer.outputs.digest }}
        run: |
          set -euo pipefail
          crane="$(go env GOPATH)/bin/crane"
          index_digest="$("$crane" digest "$WAYLAND_COMPUTER_IMAGE_NAME:$GITHUB_SHA")"
          test "$index_digest" = "$ACTION_DIGEST"
          printf '%s\n' "$index_digest" > "$RUNNER_TEMP/wayland-computer-image-index-digest.txt"
          "$crane" manifest "$WAYLAND_COMPUTER_IMAGE_NAME@$index_digest" > "$RUNNER_TEMP/wayland-computer-image-index.json"
          amd64_digest="$(cat "$RUNNER_TEMP/wayland-computer-platforms/amd64.digest")"
          arm64_digest="$(cat "$RUNNER_TEMP/wayland-computer-platforms/arm64.digest")"
          test "$(jq -r --arg digest "$amd64_digest" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64" and .digest == $digest)] | length' "$RUNNER_TEMP/wayland-computer-image-index.json")" = 1
          test "$(jq -r --arg digest "$arm64_digest" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64" and .digest == $digest)] | length' "$RUNNER_TEMP/wayland-computer-image-index.json")" = 1
          test "$(jq -r '[.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64"))] | length' "$RUNNER_TEMP/wayland-computer-image-index.json")" = 2
          # shellcheck disable=SC2016 # $digest is a jq variable, not a shell expansion.
          receipt_assertion='.digest == $digest and .image_status == "PASS" and .harness_status == "PASS" and .containerd_profile_status == "NOT-RUN" and ([.checks[] | select(.scope != "containerd-profile" and .status != "PASS")] | length) == 0 and ([.checks[] | select(.scope == "containerd-profile" and .status != "NOT-RUN")] | length) == 0 and .readiness_seconds < 60'
          jq -e --arg digest "$amd64_digest" "$receipt_assertion and .elf_e_machine == 62" "$RUNNER_TEMP/wayland-computer-platforms/amd64-runtime.json"
          jq -e --arg digest "$arm64_digest" "$receipt_assertion and .elf_e_machine == 183" "$RUNNER_TEMP/wayland-computer-platforms/arm64-runtime.json"
          furniture_assertion='.gpu_device_absent and .native_wayvnc_websocket and .view_disable_input and .agent_states_observed == ["idle","working","blocked","done"] and .self_reconfiguration_observed and .crash_briefing_observed and .mise_stubs_present and .license_manifest_present and .idle_rss_bytes > 0 and .cold_start_seconds < 60'
          jq -e "$furniture_assertion" "$RUNNER_TEMP/wayland-computer-platforms/amd64-furniture.json"
          jq -e "$furniture_assertion" "$RUNNER_TEMP/wayland-computer-platforms/arm64-furniture.json"
      - name: Emit the digest-selected Wayland Computer OCI archive
        run: |
          set -euo pipefail
          crane="$(go env GOPATH)/bin/crane"
          index_digest="$(cat "$RUNNER_TEMP/wayland-computer-image-index-digest.txt")"
          layout="$RUNNER_TEMP/wefty-computer-wayland-reference.oci"
          archive="$RUNNER_TEMP/wefty-computer-wayland-reference.oci.tar"
          "$crane" pull "$WAYLAND_COMPUTER_IMAGE_NAME@$index_digest" "$layout" --format=oci --annotate-ref
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$layout" -cf "$archive" .
          scripts/verify-acceptance-image.sh --archive "$archive" --expected-top-digest "$index_digest" \
            --expected-platform linux/amd64 --expected-platform linux/arm64 \
            --expected-platform-digest "linux/amd64=$(cat "$RUNNER_TEMP/wayland-computer-platforms/amd64.digest")" \
            --expected-platform-digest "linux/arm64=$(cat "$RUNNER_TEMP/wayland-computer-platforms/arm64.digest")" \
            --receipt-output "$RUNNER_TEMP/wayland-computer-image-archive-receipt.json"
          mkdir -p "$RUNNER_TEMP/anonymous-wayland-docker"
          if ! DOCKER_CONFIG="$RUNNER_TEMP/anonymous-wayland-docker" "$crane" manifest "$WAYLAND_COMPUTER_IMAGE_NAME@$index_digest" >/dev/null; then
            printf '%s\n' '::error title=Public GHCR verification failed::Set the repository-linked wefty-computer-wayland-reference package visibility to Public, then rerun acceptance-image.' >&2
            exit 1
          fi
      - name: Assemble the separate Wayland Computer release artifact
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/wayland-computer-image-release"
          package="$RUNNER_TEMP/wayland-computer-image-package"
          index_digest="$(cat "$RUNNER_TEMP/wayland-computer-image-index-digest.txt")"
          mkdir -p "$release" "$package"
          cp "$RUNNER_TEMP/wefty-computer-wayland-reference.oci.tar" "$release/"
          cp "$RUNNER_TEMP/wayland-computer-image-index.json" "$release/"
          cp "$RUNNER_TEMP/wayland-computer-image-index-digest.txt" "$release/"
          cp "$RUNNER_TEMP/wayland-computer-image-archive-receipt.json" "$release/"
          for arch in amd64 arm64; do
            cp "$RUNNER_TEMP/wayland-computer-platforms/$arch-runtime.json" "$release/$arch-runtime.json"
            cp "$RUNNER_TEMP/wayland-computer-platforms/$arch-metrics.json" "$release/$arch-metrics.json"
            cp "$RUNNER_TEMP/wayland-computer-platforms/$arch-furniture.json" "$release/$arch-furniture.json"
          done
          jq -n --arg commit "$GITHUB_SHA" --arg reference "$WAYLAND_COMPUTER_IMAGE_NAME" --arg index_digest "$index_digest" \
            --arg amd64_digest "$(cat "$RUNNER_TEMP/wayland-computer-platforms/amd64.digest")" --arg arm64_digest "$(cat "$RUNNER_TEMP/wayland-computer-platforms/arm64.digest")" \
            '{version:1,commit:$commit,reference:$reference,index_digest:$index_digest,platforms:{"linux/amd64":$amd64_digest,"linux/arm64":$arm64_digest},public_pull:true,archive_verified:true,runtime_verified:{"linux/amd64":true,"linux/arm64":true},furniture_verified:{"linux/amd64":true,"linux/arm64":true}}' \
            > "$release/wayland-computer-image-receipt.json"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP" \
            -cf "$package/wefty-computer-wayland-reference-release.tar" wayland-computer-image-release
      - name: Upload stable Wayland Computer image outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wefty-computer-wayland-reference-${{ github.sha }}
          path: ${{ runner.temp }}/wayland-computer-image-package
          if-no-files-found: error
