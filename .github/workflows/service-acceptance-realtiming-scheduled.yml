name: service-acceptance-realtiming-scheduled

# Evidence lane only: production clocks make this too slow for pull requests.
# It is intentionally absent from contract-gate's all-tests-pass aggregation.
on:
  workflow_dispatch:
    inputs:
      mutation_row:
        description: Optional stable Linux Computer row whose live path is mutated; success requires exactly that row to FAIL
        required: false
        type: choice
        default: none
        options:
          - none
          - linux.create_boot
          - linux.remote_takeover
          - linux.restart_survival
          - linux.reconfiguration
          - linux.storage_provenance
          - linux.guest_authority
          - linux.removal
  schedule:
    - cron: "47 7 * * 1"

permissions:
  actions: read
  contents: read

concurrency:
  group: service-acceptance-realtiming-scheduled-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-published-artifact:
    name: resolve-published-artifact
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.resolve.outputs.available }}
      candidate-sha: ${{ steps.resolve.outputs.candidate_sha }}
      run-id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Resolve the immutable publishing run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_run ]; then
            if [ "$TRIGGER_CONCLUSION" != success ]; then
              printf '%s\n' "::notice::typed-skip: acceptance-image run $TRIGGER_RUN_ID concluded $TRIGGER_CONCLUSION; no published artifact exists"
              printf 'available=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            run_id="$TRIGGER_RUN_ID"
            candidate_sha="$TRIGGER_SHA"
          else
            published="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow acceptance-image.yml --branch main --status success --limit 1 --json databaseId,headSha)"
            if [ "$(jq 'length' <<<"$published")" = 0 ]; then
              printf '%s\n' '::notice::typed-skip: no successful acceptance-image publication exists on main yet'
              printf 'available=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            run_id="$(jq -r '.[0].databaseId' <<<"$published")"
            candidate_sha="$(jq -r '.[0].headSha' <<<"$published")"
          fi
          case "$candidate_sha" in *[!0-9a-f]*|'') exit 64 ;; esac
          printf 'available=true\ncandidate_sha=%s\nrun_id=%s\n' "$candidate_sha" "$run_id" >> "$GITHUB_OUTPUT"

  service-acceptance-realtiming:
    name: service-acceptance-realtiming / ${{ matrix.os }} / ${{ matrix.image }}
    needs: [resolve-published-artifact]
    if: needs.resolve-published-artifact.outputs.available == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, image: xfce}
          - {os: ubuntu-latest, image: xfce}
          - {os: ubuntu-latest, image: wayland}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      IMAGE_NAME: ghcr.io/derek-x-wang/wefty-echo-service
      COMPUTER_IMAGE_NAME: ghcr.io/derek-x-wang/wefty-computer-reference
      WEFTY_LINUX_COMPUTER_MUTATE_ROW: ${{ inputs.mutation_row != 'none' && inputs.mutation_row || '' }}
      WAYLAND_COMPUTER_IMAGE_NAME: ghcr.io/derek-x-wang/wefty-computer-wayland-reference
      COMPUTER_VARIANT: ${{ matrix.image }}
    steps:
      - name: Check out trusted main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Detach to the validated artifact-producing commit
        env:
          EXPECTED_SHA: ${{ needs.resolve-published-artifact.outputs.candidate-sha }}
        run: |
          set -euo pipefail
          case "$EXPECTED_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) exit 64 ;;
          esac
          git merge-base --is-ancestor "$EXPECTED_SHA" HEAD
          git checkout --detach "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Download the triggering publication artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wefty-echo-service-${{ needs.resolve-published-artifact.outputs.candidate-sha }}
          path: ${{ runner.temp }}/acceptance-image-download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-published-artifact.outputs.run-id }}
      - name: Download the matching Computer image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wefty-computer-reference-${{ needs.resolve-published-artifact.outputs.candidate-sha }}
          path: ${{ runner.temp }}/computer-image-download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-published-artifact.outputs.run-id }}
      - name: Download the matching Wayland Computer image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wefty-computer-wayland-reference-${{ needs.resolve-published-artifact.outputs.candidate-sha }}
          path: ${{ runner.temp }}/wayland-computer-image-download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-published-artifact.outputs.run-id }}
      - name: Pin the downloaded artifact identity
        env:
          EXPECTED_SHA: ${{ needs.resolve-published-artifact.outputs.candidate-sha }}
        run: |
          set -euo pipefail
          tar -xf "$RUNNER_TEMP/acceptance-image-download/wefty-acceptance-image-release.tar" -C "$RUNNER_TEMP"
          tar -xf "$RUNNER_TEMP/computer-image-download/wefty-computer-reference-release.tar" -C "$RUNNER_TEMP"
          tar -xf "$RUNNER_TEMP/wayland-computer-image-download/wefty-computer-wayland-reference-release.tar" -C "$RUNNER_TEMP"
          test "$(jq -r .commit "$RUNNER_TEMP/acceptance-image-release/acceptance-image-receipt.json")" = "$EXPECTED_SHA"
          test "$(jq -r .commit "$RUNNER_TEMP/computer-image-release/computer-image-receipt.json")" = "$EXPECTED_SHA"
          test "$(jq -r .commit "$RUNNER_TEMP/wayland-computer-image-release/wayland-computer-image-receipt.json")" = "$EXPECTED_SHA"
          candidate_sha="$(git rev-parse HEAD)"
          test "$candidate_sha" = "$EXPECTED_SHA"
          printf 'CANDIDATE_SHA=%s\nPUBLISHED_SHA=%s\nWEFTY_REALTIME_EVIDENCE_SOURCE=published-artifact\n' \
            "$candidate_sha" "$EXPECTED_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Provision pinned Linux OCI engine and probe
        if: runner.os == 'Linux'
        env:
          CONTAINERD_VERSION: 2.3.4
          RUNC_VERSION: 1.5.1
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes e2fsprogs util-linux
          if ! sudo iptables -I OUTPUT 1 -p tcp --dport 443 -m conntrack --ctstate NEW -m owner --uid-owner 0 -j REJECT; then
            printf '%s\n' '::error::owner-scoped registry fault rule is unsupported'
            exit 1
          fi
          if ! sudo iptables -D OUTPUT -p tcp --dport 443 -m conntrack --ctstate NEW -m owner --uid-owner 0 -j REJECT; then
            printf '%s\n' '::error::owner-scoped registry fault rule could not be removed'
            exit 1
          fi
          sudo modprobe loop
          test -e /dev/loop-control
          curl --fail --location --retry 5 --output containerd.tar.gz "https://github.com/containerd/containerd/releases/download/v${CONTAINERD_VERSION}/containerd-${CONTAINERD_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --retry 5 --output containerd.sha256 "https://github.com/containerd/containerd/releases/download/v${CONTAINERD_VERSION}/containerd-${CONTAINERD_VERSION}-linux-amd64.tar.gz.sha256sum"
          sed -i "s/containerd-${CONTAINERD_VERSION}-linux-amd64.tar.gz/containerd.tar.gz/" containerd.sha256
          sha256sum --check containerd.sha256
          sudo tar --extract --gzip --file containerd.tar.gz --directory /usr/local
          curl --fail --location --retry 5 --output runc.amd64 "https://github.com/opencontainers/runc/releases/download/v${RUNC_VERSION}/runc.amd64"
          curl --fail --location --retry 5 --output runc.sha256sum "https://github.com/opencontainers/runc/releases/download/v${RUNC_VERSION}/runc.sha256sum"
          grep ' runc.amd64$' runc.sha256sum | sha256sum --check
          sudo install --mode=0755 runc.amd64 /usr/local/sbin/runc
          sudo modprobe overlay
          grep -qw overlay /proc/filesystems
          sudo install --directory --mode=0700 /var/lib/wefty-containerd /run/wefty-containerd /var/lib/wefty/oci
          sudo tee /etc/systemd/system/wefty-test-containerd.service >/dev/null <<'UNIT'
          [Unit]
          Description=Wefty realtiming pinned containerd
          [Service]
          Type=simple
          ExecStart=/usr/local/bin/containerd --address /run/wefty-containerd/containerd.sock --root /var/lib/wefty-containerd/root --state /run/wefty-containerd/state
          Restart=no
          KillMode=control-group
          UNIT
          sudo systemctl daemon-reload
          sudo systemctl start wefty-test-containerd.service
          for _ in $(seq 1 60); do
            if sudo /usr/local/bin/ctr --address /run/wefty-containerd/containerd.sock version >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          sudo /usr/local/bin/ctr --address /run/wefty-containerd/containerd.sock version
          sudo chmod 0600 /run/wefty-containerd/containerd.sock
          release="$RUNNER_TEMP/acceptance-image-release"
          manifest="$release/linux-amd64/share/wefty/oci/manifest.json"
          ECHO_REFERENCE="$(jq -r .probe_reference "$manifest")"
          ECHO_DIGEST="$(jq -r .probe_digest "$manifest")"
          test "$ECHO_REFERENCE" = "$IMAGE_NAME"
          test "$ECHO_DIGEST" = "$(cat "$release/acceptance-image-index-digest.txt")"
          ECHO_ARCHIVE="$release/linux-amd64/share/wefty/oci/$(jq -r .probe_archive_path "$manifest")"
          scripts/verify-acceptance-image.sh \
            --archive "$ECHO_ARCHIVE" \
            --expected-top-digest "$ECHO_DIGEST" \
            --expected-platform linux/amd64 \
            --expected-platform linux/arm64 \
            --receipt-output /tmp/wefty-acceptance-image.json
          chmod 0644 "$ECHO_ARCHIVE"
          computer_release="$RUNNER_TEMP/computer-image-release"
          COMPUTER_REFERENCE="$(jq -r .reference "$computer_release/computer-image-receipt.json")"
          COMPUTER_DIGEST="$(jq -r .index_digest "$computer_release/computer-image-receipt.json")"
          COMPUTER_ARCHIVE="$computer_release/wefty-computer-reference.oci.tar"
          test "$COMPUTER_REFERENCE" = "$COMPUTER_IMAGE_NAME"
          test "$COMPUTER_DIGEST" = "$(cat "$computer_release/computer-image-index-digest.txt")"
          scripts/verify-acceptance-image.sh \
            --archive "$COMPUTER_ARCHIVE" \
            --expected-top-digest "$COMPUTER_DIGEST" \
            --expected-platform linux/amd64 \
            --expected-platform linux/arm64 \
            --receipt-output /tmp/wefty-computer-image.json
          chmod 0644 "$COMPUTER_ARCHIVE"
          wayland_computer_release="$RUNNER_TEMP/wayland-computer-image-release"
          WAYLAND_COMPUTER_REFERENCE="$(jq -r .reference "$wayland_computer_release/wayland-computer-image-receipt.json")"
          WAYLAND_COMPUTER_DIGEST="$(jq -r .index_digest "$wayland_computer_release/wayland-computer-image-receipt.json")"
          WAYLAND_COMPUTER_ARCHIVE="$wayland_computer_release/wefty-computer-wayland-reference.oci.tar"
          test "$WAYLAND_COMPUTER_REFERENCE" = "$WAYLAND_COMPUTER_IMAGE_NAME"
          test "$WAYLAND_COMPUTER_DIGEST" = "$(cat "$wayland_computer_release/wayland-computer-image-index-digest.txt")"
          scripts/verify-acceptance-image.sh \
            --archive "$WAYLAND_COMPUTER_ARCHIVE" \
            --expected-top-digest "$WAYLAND_COMPUTER_DIGEST" \
            --expected-platform linux/amd64 \
            --expected-platform linux/arm64 \
            --receipt-output /tmp/wefty-wayland-computer-image.json
          chmod 0644 "$WAYLAND_COMPUTER_ARCHIVE"
          PROBE_REFERENCE="$ECHO_REFERENCE"
          PROBE_DIGEST="$ECHO_DIGEST"
          WEFTY_AGENT="$release/linux-amd64/libexec/wefty-agent"
          WEFTY_CLI="$release/linux-amd64/bin/wefty"
          chmod 0755 "$WEFTY_AGENT" "$WEFTY_CLI"
          docker buildx create --name wefty-realtiming --driver docker-container --use
          docker buildx inspect --bootstrap
          NUMERIC_REFERENCE="wefty.local/service-data-numeric:${CANDIDATE_SHA}"
          NAMED_REFERENCE="wefty.local/service-data-named:${CANDIDATE_SHA}"
          install --directory --mode=0755 /tmp/wefty-service-data-numeric /tmp/wefty-service-data-named
          printf '%s\n' "FROM $ECHO_REFERENCE@$ECHO_DIGEST" 'USER 13001:13002' > /tmp/wefty-service-data-numeric/Dockerfile
          docker buildx build --platform linux/amd64 --tag "$NUMERIC_REFERENCE" \
            --output type=oci,dest=/tmp/wefty-service-data-numeric.oci.tar /tmp/wefty-service-data-numeric
          printf '%s\n' \
            "FROM $ECHO_REFERENCE@$ECHO_DIGEST" \
            'RUN printf "wefty:x:12001:12002:wefty:/nonexistent:/bin/sh\n" >> /etc/passwd && printf "wefty:x:12002:\n" >> /etc/group' \
            'USER wefty:wefty' \
            > /tmp/wefty-service-data-named/Dockerfile
          docker buildx build --platform linux/amd64 --tag "$NAMED_REFERENCE" \
            --output type=oci,dest=/tmp/wefty-service-data-named.oci.tar /tmp/wefty-service-data-named
          chmod 0644 /tmp/wefty-service-data-numeric.oci.tar /tmp/wefty-service-data-named.oci.tar
          sudo install -D --owner=root --group=root --mode=0755 "$WEFTY_AGENT" /usr/local/libexec/wefty-agent-oci-realtiming
          HELPER_CHECKSUM="sha256:$(sha256sum "$WEFTY_AGENT" | cut -d' ' -f1)"
          test "$HELPER_CHECKSUM" = "$(jq -r .helper_checksum "$manifest")"
          AGENT_UID="$(id -u)"
          AGENT_GROUP="$(id -gn)"
          sudo install --directory --owner=root --group="$AGENT_GROUP" --mode=0750 /run/wefty-oci-helper
          sudo tee /etc/systemd/system/wefty-oci-helper-realtiming.socket >/dev/null <<UNIT
          [Unit]
          Description=Wefty OCI helper realtiming socket
          [Socket]
          ListenStream=/run/wefty-oci-helper/helper.sock
          SocketMode=0660
          SocketUser=root
          SocketGroup=$AGENT_GROUP
          RemoveOnStop=true
          [Install]
          WantedBy=sockets.target
          UNIT
          sudo tee /etc/systemd/system/wefty-oci-helper-realtiming.service >/dev/null <<UNIT
          [Unit]
          Description=Wefty OCI helper realtiming service
          After=wefty-test-containerd.service
          [Service]
          Type=simple
          Environment=WEFTY_OCI_HELPER_ALLOWED_UIDS=$AGENT_UID
          ExecStart=/usr/local/libexec/wefty-agent-oci-realtiming __wefty_oci_helper --oci-containerd-address /run/wefty-containerd/containerd.sock --oci-containerd-state-root /run/wefty-containerd/state --oci-runtime-root /var/lib/wefty/oci --oci-memory-capacity-bytes 4294967296 --oci-memory-reserve-bytes 1073741824
          User=root
          Group=root
          StandardError=append:/tmp/wefty-oci-helper-realtiming.stderr
          UNIT
          sudo systemctl daemon-reload
          sudo systemctl start wefty-oci-helper-realtiming.socket
          for _ in $(seq 1 60); do
            if [ -S /run/wefty-oci-helper/helper.sock ]; then break; fi
            sleep 1
          done
          test -S /run/wefty-oci-helper/helper.sock
          sudo install --directory --mode=0777 /tmp/wefty-oci-faults
          sudo mkfifo /tmp/wefty-oci-faults/control
          sudo chmod 0666 /tmp/wefty-oci-faults/control
          sudo install --owner=root --group=root --mode=0755 scripts/oci-lost-attempt-fault.sh /usr/local/libexec/wefty-oci-lost-attempt-fault
          sudo tee /usr/local/libexec/wefty-oci-fault-supervisor >/dev/null <<'SCRIPT'
          #!/bin/sh
          set -eu
          while true; do
            if IFS= read -r action < /tmp/wefty-oci-faults/control; then
              case "$action" in
                kill-shim)
                  printf '%s\n' 'kill-shim requires an exact workload Job binding' > "/tmp/wefty-oci-faults/$action.failed"
                  continue
                  ;;
                kill-payload:*|kill-shim:*)
                  job_id="${action#*:}"
                  containers=""
                  for candidate in $(/usr/local/bin/ctr --address /run/wefty-containerd/containerd.sock --namespace wefty tasks list --quiet); do
                    candidate_job_id="$(/usr/local/bin/ctr --address /run/wefty-containerd/containerd.sock --namespace wefty containers info "$candidate" | jq -r '.Labels["io.wefty/job_id"] // empty')"
                    if [ "$candidate_job_id" = "$job_id" ]; then
                      containers="$containers $candidate"
                    fi
                  done
                  set -- $containers
                  if [ "$#" -ne 1 ]; then
                    printf 'exact Job binding matched %s workloads\n' "$#" > "/tmp/wefty-oci-faults/$action.failed"
                    continue
                  fi
                  container="$1"
                  if [ "${action%%:*}" = kill-payload ]; then
                    /usr/local/bin/ctr --address /run/wefty-containerd/containerd.sock --namespace wefty tasks kill --signal KILL "$container"
                  else
                    shim_pids=""
                    for command_line in /proc/[0-9]*/cmdline; do
                      [ -r "$command_line" ] || continue
                      if tr '\0' '\n' < "$command_line" | awk -v container="$container" 'previous == "-id" && $0 == container { found=1 } { previous=$0 } END { exit !found }'; then
                        shim_pid="${command_line#/proc/}"
                        shim_pid="${shim_pid%/cmdline}"
                        shim_pids="$shim_pids $shim_pid"
                      fi
                    done
                    set -- $shim_pids
                    if [ "$#" -ne 1 ]; then
                      printf 'exact workload shim binding matched %s processes\n' "$#" > "/tmp/wefty-oci-faults/$action.failed"
                      continue
                    fi
                    kill -KILL "$1"
                  fi
                  ;;
                stop-containerd)
                  systemctl stop wefty-test-containerd.service
                  ;;
                start-containerd)
                  systemctl start wefty-test-containerd.service
                  for _ in $(seq 1 60); do
                    if /usr/local/bin/ctr --address /run/wefty-containerd/containerd.sock version >/dev/null 2>&1; then break; fi
                    sleep 1
                  done
                  /usr/local/bin/ctr --address /run/wefty-containerd/containerd.sock version >/dev/null
                  chmod 0600 /run/wefty-containerd/containerd.sock
                  ;;
                kill-helper)
                  systemctl kill --kill-who=all --signal=KILL wefty-oci-helper-realtiming.service
                  systemctl reset-failed wefty-oci-helper-realtiming.service
                  systemctl start wefty-oci-helper-realtiming.service
                  systemctl is-active --quiet wefty-oci-helper-realtiming.service
                  ;;
                reset-containerd)
                  systemctl stop wefty-test-containerd.service
                  rm -rf /var/lib/wefty-containerd/root /run/wefty-containerd/state
                  systemctl start wefty-test-containerd.service
                  for _ in $(seq 1 60); do
                    if /usr/local/bin/ctr --address /run/wefty-containerd/containerd.sock version >/dev/null 2>&1; then break; fi
                    sleep 1
                  done
                  /usr/local/bin/ctr --address /run/wefty-containerd/containerd.sock version >/dev/null
                  chmod 0600 /run/wefty-containerd/containerd.sock
                  ;;
                disable-registry)
                  iptables -I OUTPUT 1 -p tcp --dport 443 -m conntrack --ctstate NEW -m owner --uid-owner 0 -j REJECT
                  ;;
                enable-registry)
                  iptables -D OUTPUT -p tcp --dport 443 -m conntrack --ctstate NEW -m owner --uid-owner 0 -j REJECT
                  ;;
                save-attempt-record:wefty-container-*|restore-never-seal-log:wefty-container-*:wefty-log-segments-*|restore-populated-cgroup:wefty-container-*:wefty-cgroup-*|remove-lost-log:wefty-container-*:wefty-log-segments-*)
                  # stderr goes to a scratch file first: the test treats the mere existence of
                  # .failed as a verdict, so it must only appear once the fault has failed.
                  if /usr/local/libexec/wefty-oci-lost-attempt-fault "$action" 2> "/tmp/wefty-oci-faults/$action.stderr"; then
                    rm -f "/tmp/wefty-oci-faults/$action.stderr"
                  else
                    fault_status="$?"
                    printf 'fault %s exited %s\n' "$action" "$fault_status" >> "/tmp/wefty-oci-faults/$action.stderr"
                    mv "/tmp/wefty-oci-faults/$action.stderr" "/tmp/wefty-oci-faults/$action.failed"
                    continue
                  fi
                  ;;
                assert-computer-clean:wefty-log-segments-*)
                  name="${action#assert-computer-clean:}"
                  path="/var/lib/wefty/oci/logs/$name"
                  if grep -F " $path/control " /proc/mounts >/dev/null || test -e "$path"; then
                    printf 'control mount or log directory remains at %s\n' "$path" > "/tmp/wefty-oci-faults/$action.failed"
                    continue
                  fi
                  ;;
                *) exit 64 ;;
              esac
              touch "/tmp/wefty-oci-faults/$action.done"
            fi
          done
          SCRIPT
          sudo chmod 0755 /usr/local/libexec/wefty-oci-fault-supervisor
          sudo sh -c 'nohup /usr/local/libexec/wefty-oci-fault-supervisor >/tmp/wefty-oci-fault-supervisor.log 2>&1 &'
          runner_job_uid="$(id -u)"
          if test "$runner_job_uid" -eq 0; then
            printf '%s\n' '::error::the workflow job is unexpectedly running as root'
            exit 1
          fi
          if ! runner_listener_pid="$(pgrep -o -f '[R]unner.Listener')" || test -z "$runner_listener_pid"; then
            printf '%s\n' '::error::Runner.Listener process was not found'
            exit 1
          fi
          if ! runner_listener_uid="$(ps -o uid= -p "$runner_listener_pid" | tr -d ' ')" || test -z "$runner_listener_uid"; then
            printf '%s\n' '::error::Runner.Listener uid could not be read'
            exit 1
          fi
          if ! runner_listener_owner="$(ps -o user= -p "$runner_listener_pid" | tr -d ' ')" || test -z "$runner_listener_owner"; then
            printf '%s\n' '::error::Runner.Listener owner could not be read'
            exit 1
          fi
          if test "$runner_listener_uid" -eq 0; then
            printf '%s\n' '::error::Runner.Listener is unexpectedly running as root'
            exit 1
          fi
          {
            /usr/local/bin/containerd --version
            /usr/local/sbin/runc --version
            grep -w overlay /proc/filesystems
            sudo stat --format='raw_socket_mode=%a raw_socket_owner=%U:%G' /run/wefty-containerd/containerd.sock
            printf 'runner_job_uid=%s\nrunner_listener_uid=%s\nrunner_listener_owner=%s\n' \
              "$runner_job_uid" "$runner_listener_uid" "$runner_listener_owner"
            printf 'acceptance_reference=%s\nacceptance_index_digest=%s\n' "$PROBE_REFERENCE" "$PROBE_DIGEST"
            cat /tmp/wefty-acceptance-image.json
            printf 'computer_reference=%s\ncomputer_index_digest=%s\n' "$COMPUTER_REFERENCE" "$COMPUTER_DIGEST"
            cat /tmp/wefty-computer-image.json
            printf 'wayland_computer_reference=%s\nwayland_computer_index_digest=%s\n' "$WAYLAND_COMPUTER_REFERENCE" "$WAYLAND_COMPUTER_DIGEST"
            cat /tmp/wefty-wayland-computer-image.json
          } > /tmp/wefty-oci-provision.txt
          {
            printf 'WEFTY_OCI_CONTAINERD_ADDRESS=%s\n' /run/wefty-containerd/containerd.sock
            printf 'WEFTY_OCI_HELPER_SOCKET=%s\n' /run/wefty-oci-helper/helper.sock
            printf 'WEFTY_OCI_HELPER_CHECKSUM=%s\n' "$HELPER_CHECKSUM"
            printf 'WEFTY_OCI_PROBE_REFERENCE=%s\n' "$PROBE_REFERENCE"
            printf 'WEFTY_OCI_PROBE_DIGEST=%s\n' "$PROBE_DIGEST"
            printf 'WEFTY_OCI_PROBE_ARCHIVE=%s\n' "$ECHO_ARCHIVE"
            printf 'WEFTY_OCI_ECHO_REFERENCE=%s\n' "$ECHO_REFERENCE"
            printf 'WEFTY_OCI_ECHO_DIGEST=%s\n' "$ECHO_DIGEST"
            printf 'WEFTY_OCI_ECHO_ARCHIVE=%s\n' "$ECHO_ARCHIVE"
            if [ "$COMPUTER_VARIANT" = wayland ]; then
              printf 'WEFTY_OCI_COMPUTER_REFERENCE=%s\n' "$WAYLAND_COMPUTER_REFERENCE"
              printf 'WEFTY_OCI_COMPUTER_DIGEST=%s\n' "$WAYLAND_COMPUTER_DIGEST"
              printf 'WEFTY_OCI_COMPUTER_ARCHIVE=%s\n' "$WAYLAND_COMPUTER_ARCHIVE"
              printf 'WEFTY_OCI_COMPUTER_RUNTIME_RECEIPT=%s\n' "$wayland_computer_release/amd64-runtime.json"
            else
              printf 'WEFTY_OCI_COMPUTER_REFERENCE=%s\n' "$COMPUTER_REFERENCE"
              printf 'WEFTY_OCI_COMPUTER_DIGEST=%s\n' "$COMPUTER_DIGEST"
              printf 'WEFTY_OCI_COMPUTER_ARCHIVE=%s\n' "$COMPUTER_ARCHIVE"
              printf 'WEFTY_OCI_COMPUTER_RUNTIME_RECEIPT=%s\n' "$computer_release/amd64-runtime.json"
            fi
            printf 'WEFTY_OCI_COMPUTER_VARIANT=%s\n' "$COMPUTER_VARIANT"
            printf 'WEFTY_OCI_XFCE_COMPUTER_REFERENCE=%s\n' "$COMPUTER_REFERENCE"
            printf 'WEFTY_OCI_XFCE_COMPUTER_DIGEST=%s\n' "$COMPUTER_DIGEST"
            printf 'WEFTY_OCI_XFCE_COMPUTER_ARCHIVE=%s\n' "$COMPUTER_ARCHIVE"
            printf 'WEFTY_OCI_WAYLAND_COMPUTER_REFERENCE=%s\n' "$WAYLAND_COMPUTER_REFERENCE"
            printf 'WEFTY_OCI_WAYLAND_COMPUTER_DIGEST=%s\n' "$WAYLAND_COMPUTER_DIGEST"
            printf 'WEFTY_OCI_WAYLAND_COMPUTER_ARCHIVE=%s\n' "$WAYLAND_COMPUTER_ARCHIVE"
            printf 'WEFTY_OCI_CLI=%s\n' "$WEFTY_CLI"
            printf 'WEFTY_OCI_SERVICE_NUMERIC_REFERENCE=%s\n' "$NUMERIC_REFERENCE"
            printf 'WEFTY_OCI_SERVICE_NUMERIC_ARCHIVE=%s\n' /tmp/wefty-service-data-numeric.oci.tar
            printf 'WEFTY_OCI_SERVICE_NAMED_REFERENCE=%s\n' "$NAMED_REFERENCE"
            printf 'WEFTY_OCI_SERVICE_NAMED_ARCHIVE=%s\n' /tmp/wefty-service-data-named.oci.tar
            printf 'WEFTY_OCI_FAULT_FIFO=%s\n' /tmp/wefty-oci-faults/control
            printf 'WEFTY_OCI_FAULT_DIR=%s\n' /tmp/wefty-oci-faults
            printf 'WEFTY_OCI_PROVISION_RECEIPT=%s\n' /tmp/wefty-oci-provision.txt
          } >> "$GITHUB_ENV"
      - name: Run service acceptance at production timings
        env:
          WEFTY_REALTIME_EVIDENCE_DIR: ${{ runner.temp }}/service-acceptance-realtiming
        run: |
          mkdir -p "$WEFTY_REALTIME_EVIDENCE_DIR"
          if [ -f /tmp/wefty-oci-provision.txt ]; then
            cp /tmp/wefty-oci-provision.txt "$WEFTY_REALTIME_EVIDENCE_DIR/"
          fi
          printf 'commit=%s\nrunner=%s\n' "$CANDIDATE_SHA" "$RUNNER_NAME" > "$WEFTY_REALTIME_EVIDENCE_DIR/workflow.txt"
          go version >> "$WEFTY_REALTIME_EVIDENCE_DIR/workflow.txt"
          go test -count=1 -p 1 -timeout=75m -v -tags=service_acceptance_realtiming ./...
      - name: Capture Linux OCI service diagnostics
        if: ${{ always() && runner.os == 'Linux' }}
        env:
          WEFTY_REALTIME_EVIDENCE_DIR: ${{ runner.temp }}/service-acceptance-realtiming
        run: |
          mkdir -p "$WEFTY_REALTIME_EVIDENCE_DIR"
          diagnostics_status="$WEFTY_REALTIME_EVIDENCE_DIR/linux-oci-diagnostics.status.txt"
          : > "$diagnostics_status"
          set +e
          sudo journalctl --boot --no-pager --utc --output=short-precise \
            -u wefty-oci-helper-realtiming.service \
            -u wefty-test-containerd.service \
            2>&1 | tee "$WEFTY_REALTIME_EVIDENCE_DIR/linux-oci-services.journal.txt" >/dev/null
          journal_status="${PIPESTATUS[0]}"
          printf 'journalctl_exit=%s\n' "$journal_status" >> "$diagnostics_status"
          sudo systemctl status --no-pager --full \
            wefty-oci-helper-realtiming.socket \
            wefty-oci-helper-realtiming.service \
            wefty-test-containerd.service \
            2>&1 | tee "$WEFTY_REALTIME_EVIDENCE_DIR/linux-oci-services.status.txt" >/dev/null
          systemctl_status="${PIPESTATUS[0]}"
          printf 'systemctl_status_exit=%s\n' "$systemctl_status" >> "$diagnostics_status"
          sudo test -f /tmp/wefty-oci-helper-realtiming.stderr
          helper_stderr_test_status="$?"
          printf 'helper_stderr_test_exit=%s\n' "$helper_stderr_test_status" >> "$diagnostics_status"
          if [ "$helper_stderr_test_status" -eq 0 ]; then
            sudo cat /tmp/wefty-oci-helper-realtiming.stderr 2>&1 | \
              tee "$WEFTY_REALTIME_EVIDENCE_DIR/wefty-oci-helper.stderr.txt" >/dev/null
            helper_stderr_capture_status="${PIPESTATUS[0]}"
          else
            printf '%s\n' 'helper stderr file was not created' \
              > "$WEFTY_REALTIME_EVIDENCE_DIR/wefty-oci-helper.stderr.txt"
            helper_stderr_capture_status="$helper_stderr_test_status"
          fi
          printf 'helper_stderr_capture_exit=%s\n' "$helper_stderr_capture_status" >> "$diagnostics_status"
          set -e
      - name: Upload service acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: service-acceptance-realtiming-${{ matrix.os }}-${{ matrix.image }}-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/service-acceptance-realtiming
          if-no-files-found: error

  realtiming-result:
    name: realtiming-result
    needs: [resolve-published-artifact, service-acceptance-realtiming]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main history for the receipt gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Detach the receipt gate to the validated publishing commit
        env:
          EXPECTED_SHA: ${{ needs.resolve-published-artifact.outputs.candidate-sha }}
        run: |
          set -euo pipefail
          case "$EXPECTED_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) exit 64 ;;
          esac
          git merge-base --is-ancestor "$EXPECTED_SHA" HEAD
          git checkout --detach "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Download the Linux XFCE matrix receipt
        if: needs.resolve-published-artifact.outputs.available == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: service-acceptance-realtiming-ubuntu-latest-xfce-${{ needs.resolve-published-artifact.outputs.candidate-sha }}
          path: ${{ runner.temp }}/linux-computer-receipt-xfce
      - name: Download the Linux Wayland matrix receipt
        if: needs.resolve-published-artifact.outputs.available == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: service-acceptance-realtiming-ubuntu-latest-wayland-${{ needs.resolve-published-artifact.outputs.candidate-sha }}
          path: ${{ runner.temp }}/linux-computer-receipt-wayland
      - name: Fail closed unless the published lane executed and passed
        env:
          RESOLVE_RESULT: ${{ needs.resolve-published-artifact.result }}
          ARTIFACT_AVAILABLE: ${{ needs.resolve-published-artifact.outputs.available }}
          REALTIMING_RESULT: ${{ needs.service-acceptance-realtiming.result }}
        run: |
          set -eu
          printf '%s\n' \
            "resolve-published-artifact=$RESOLVE_RESULT" \
            "artifact-available=$ARTIFACT_AVAILABLE" \
            "service-acceptance-realtiming=$REALTIMING_RESULT"
          test "$RESOLVE_RESULT" = success
          test "$ARTIFACT_AVAILABLE" = true
          test "$REALTIMING_RESULT" = success
          scripts/check-linux-computer-receipt.sh \
            "$RUNNER_TEMP/linux-computer-receipt-xfce/linux-computer-matrix.json" \
            "${{ needs.resolve-published-artifact.outputs.candidate-sha }}" xfce \
            "${{ inputs.mutation_row != 'none' && inputs.mutation_row || '' }}"
          scripts/check-linux-computer-receipt.sh \
            "$RUNNER_TEMP/linux-computer-receipt-wayland/linux-computer-matrix.json" \
            "${{ needs.resolve-published-artifact.outputs.candidate-sha }}" wayland \
            "${{ inputs.mutation_row != 'none' && inputs.mutation_row || '' }}"
          scripts/check-native-linux-oci-receipt.sh \
            "$RUNNER_TEMP/linux-computer-receipt-xfce/native-linux-oci.txt" published-artifact \
            "$RUNNER_TEMP/linux-computer-receipt-xfce/oci-service-publication-linux.txt" \
            "$RUNNER_TEMP/linux-computer-receipt-xfce/oci-service-l1-agent-linux.txt"
          scripts/check-native-linux-oci-receipt.sh \
            "$RUNNER_TEMP/linux-computer-receipt-wayland/native-linux-oci.txt" published-artifact \
            "$RUNNER_TEMP/linux-computer-receipt-wayland/oci-service-publication-linux.txt" \
            "$RUNNER_TEMP/linux-computer-receipt-wayland/oci-service-l1-agent-linux.txt"
